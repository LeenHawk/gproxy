[build.env]
passthrough = [
    "GPROXY_UPDATE_PUBKEY",
    "GPROXY_BUILD_VERSION",
    "GPROXY_BUILD_CHANNEL",
    "GPROXY_BUILD_HASH",
    "GPROXY_INSTALLATION_KIND",
]
[build]
pre-build = "scripts/install-cross-go.sh"

[build.env]
# cross runs as the invoking UID; its default home may not be writable.
passthrough = [
    "GOCACHE=/target/.cache/go-build",
    "GOMODCACHE=/target/.cache/go-mod",
]

# The symbol generator needs Clang's JSON AST support; 0.2.5's ARM image
# uses Ubuntu 18.04, whose default Clang is too old.
[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"

[target.riscv64gc-unknown-linux-gnu]
image = "ghcr.io/cross-rs/riscv64gc-unknown-linux-gnu:main"

[target.riscv64gc-unknown-linux-musl]
image = "ghcr.io/cross-rs/riscv64gc-unknown-linux-musl:main"
