name: GHCR Rust cache
description: Keep full Cargo build caches in GHCR instead of Actions cache storage
inputs:
  key:
    description: Build configuration and target, shared only by compatible jobs
    required: true
  restore-key:
    description: Previous compatible build key to try when this job has no cache yet
    default: ''
  token:
    description: GitHub token with package access
    required: true
  save:
    description: Main and dev update shared caches; tags and PRs only restore
    default: ${{ (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') && github.event_name != 'pull_request' }}
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      id: oras
      continue-on-error: true
      with:
        version: 1.3.0
        # ORAS 1.3 ships only x64 Windows binaries; Windows ARM64 runs them
        # through its built-in x64 emulation. Other platforms stay native.
        url: ${{ runner.os == 'Windows' && 'https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_windows_amd64.zip' || '' }}
        checksum: ${{ runner.os == 'Windows' && 'b050e93aa0dc7a79a61fa8e4074dfa302c41d4af01b634fe393c5dd687536aee' || '' }}
    - name: Retry ORAS installation after a download failure
      if: steps.oras.outcome == 'failure'
      uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      continue-on-error: true
      with:
        version: 1.3.0
        url: ${{ runner.os == 'Windows' && 'https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_windows_amd64.zip' || '' }}
        checksum: ${{ runner.os == 'Windows' && 'b050e93aa0dc7a79a61fa8e4074dfa302c41d4af01b634fe393c5dd687536aee' || '' }}
    - name: Ensure zstd is available
      shell: bash
      continue-on-error: true
      run: |
        if command -v zstd >/dev/null; then exit 0; fi
        case "$RUNNER_OS" in
          Linux)
            elevate=()
            if [ "$(id -u)" != 0 ]; then elevate=(sudo); fi
            "${elevate[@]}" apt-get update
            "${elevate[@]}" apt-get install -y --no-install-recommends zstd
            ;;
          macOS) brew install zstd ;;
          Windows) choco install zstandard --yes --no-progress ;;
        esac
    - uses: ./.github/actions/ghcr-rust-cache/runtime
      with:
        key: ${{ inputs.key }}
        restore-key: ${{ inputs.restore-key }}
        token: ${{ inputs.token }}
        save: ${{ inputs.save }}
