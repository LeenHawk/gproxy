name: GHCR Rust cache
description: Keep full Cargo build caches in GHCR instead of Actions cache storage
inputs:
  key:
    description: Build configuration and target, shared only by compatible jobs
    required: true
  token:
    description: GitHub token with package access
    required: true
  save:
    description: Only the development branch updates shared caches
    default: ${{ github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' }}
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4
      continue-on-error: true
      with:
        version: 1.3.0
        # ORAS 1.3 ships only x64 Windows binaries; Windows ARM64 runs them
        # through its built-in x64 emulation. Other platforms stay native.
        url: ${{ runner.os == 'Windows' && 'https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_windows_amd64.zip' || '' }}
        checksum: ${{ runner.os == 'Windows' && 'b050e93aa0dc7a79a61fa8e4074dfa302c41d4af01b634fe393c5dd687536aee' || '' }}
    - uses: ./.github/actions/ghcr-rust-cache/runtime
      with:
        key: ${{ inputs.key }}
        token: ${{ inputs.token }}
        save: ${{ inputs.save }}
