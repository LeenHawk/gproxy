name: Attest release packages
description: Publish build provenance and resolved build environment to GitHub
inputs:
  artifact:
    description: Artifact stem used by build-provenance.sh
    required: true
runs:
  using: composite
  steps:
    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/release/${{ inputs.artifact }}*.zip
          dist/release/${{ inputs.artifact }}*.apk
          dist/release/${{ inputs.artifact }}*.wasm
    - name: Attest resolved build environment
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: |
          dist/release/${{ inputs.artifact }}*.zip
          dist/release/${{ inputs.artifact }}*.apk
          dist/release/${{ inputs.artifact }}*.wasm
        predicate-type: https://gproxy.leenhawk.com/attestations/build-environment/v1
        predicate-path: dist/release/${{ inputs.artifact }}.provenance.json
