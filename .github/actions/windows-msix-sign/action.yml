name: SignPath MSIX
description: Attempt production signing; preserve the original release MSIX on failure
inputs:
  target:
    description: Rust target triple
    required: true
  artifact:
    description: Release artifact basename
    required: true
  version:
    description: Release version
    required: true
  mode:
    description: cli, headless or application
    required: true
  identity-name:
    description: Existing MSIX package identity name
    required: true
  display-name:
    description: Existing application display name
    required: true
  publisher:
    description: Exact Subject of the SignPath production certificate
    required: true
  api-token:
    description: SignPath API token
    required: true
  organization-id:
    description: SignPath organization ID
    required: true
  project-slug:
    description: SignPath project slug
    required: true
  signing-policy-slug:
    description: SignPath production signing policy slug
    required: true
runs:
  using: composite
  steps:
    - name: Package with signing certificate publisher
      id: package
      continue-on-error: true
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
        ARTIFACT: ${{ inputs.artifact }}
        VERSION: ${{ inputs.version }}
        MODE: ${{ inputs.mode }}
        IDENTITY: ${{ inputs.identity-name }}
        DISPLAY: ${{ inputs.display-name }}
        PUBLISHER: ${{ inputs.publisher }}
        SIGNPATH_API_TOKEN: ${{ inputs.api-token }}
        SIGNPATH_ORGANIZATION_ID: ${{ inputs.organization-id }}
        SIGNPATH_PROJECT_SLUG: ${{ inputs.project-slug }}
        SIGNPATH_SIGNING_POLICY_SLUG: ${{ inputs.signing-policy-slug }}
      run: |
        foreach ($name in @('IDENTITY', 'DISPLAY', 'PUBLISHER', 'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
        }
        if ($env:SIGNPATH_SIGNING_POLICY_SLUG -eq 'test-signing' -or $env:PUBLISHER -like '*Test certificate*') {
          throw 'Release MSIX signing requires a production policy and certificate publisher'
        }
        switch ($env:MODE) {
          cli { $executable = 'gproxy.exe' }
          headless { $executable = 'gproxy.exe' }
          application { $executable = 'gproxy-desktop.exe' }
          default { throw "Unsupported MSIX mode: $env:MODE" }
        }
        scripts/package-windows-msix.ps1 -Target $env:TARGET -Artifact $env:ARTIFACT -Version $env:VERSION `
          -Mode $env:MODE -OutputDir dist/signpath-msix -IdentityName $env:IDENTITY -DisplayName $env:DISPLAY `
          -Publisher $env:PUBLISHER -PublisherDisplayName 'SignPath Foundation'
        "executable=$executable" >> $env:GITHUB_OUTPUT
    - name: Upload unsigned release MSIX
      id: unsigned
      if: ${{ steps.package.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: unsigned-msix-${{ inputs.artifact }}
        path: dist/signpath-msix/${{ inputs.artifact }}.msix
        if-no-files-found: error
        retention-days: 7
    - name: Sign executable and MSIX
      id: sign
      if: ${{ steps.unsigned.outcome == 'success' }}
      continue-on-error: true
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
      with:
        api-token: ${{ inputs.api-token }}
        organization-id: ${{ inputs.organization-id }}
        project-slug: ${{ inputs.project-slug }}
        signing-policy-slug: ${{ inputs.signing-policy-slug }}
        artifact-configuration-slug: windows-msix
        github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 300
        service-unavailable-timeout-in-seconds: 60
        download-signed-artifact-timeout-in-seconds: 60
        output-artifact-directory: ${{ runner.temp }}/signed-${{ inputs.artifact }}
    - name: Verify production signatures and stage signed MSIX
      id: verify
      if: ${{ steps.sign.outcome == 'success' }}
      continue-on-error: true
      shell: pwsh
      env:
        SIGNED_DIRECTORY: ${{ runner.temp }}/signed-${{ inputs.artifact }}
        VERIFIED_DIRECTORY: ${{ runner.temp }}/verified-msix-${{ inputs.artifact }}
        ARTIFACT: ${{ inputs.artifact }}
        IDENTITY: ${{ inputs.identity-name }}
        EXECUTABLE: ${{ steps.package.outputs.executable }}
        PUBLISHER: ${{ inputs.publisher }}
      run: |
        scripts/verify-windows-msix.ps1 -Directory $env:SIGNED_DIRECTORY -Artifact $env:ARTIFACT `
          -IdentityName $env:IDENTITY -Executable $env:EXECUTABLE -Publisher $env:PUBLISHER -OutputDirectory $env:VERIFIED_DIRECTORY
    - name: Use verified signed MSIX
      if: ${{ steps.verify.outcome == 'success' }}
      shell: pwsh
      env:
        VERIFIED_DIRECTORY: ${{ runner.temp }}/verified-msix-${{ inputs.artifact }}
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        Copy-Item "$env:VERIFIED_DIRECTORY/$env:ARTIFACT.msix", "$env:VERIFIED_DIRECTORY/$env:ARTIFACT.msix.sha256" dist/release -Force
        "$env:ARTIFACT.msix: production signatures verified." >> $env:GITHUB_STEP_SUMMARY
    - name: Report unsigned fallback
      if: ${{ !cancelled() && steps.verify.outcome != 'success' }}
      shell: pwsh
      env:
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        Write-Warning "SignPath signing failed or is unavailable for $env:ARTIFACT.msix; publishing the original unsigned package."
        "$env:ARTIFACT.msix: SignPath unavailable; original unsigned package retained." >> $env:GITHUB_STEP_SUMMARY
