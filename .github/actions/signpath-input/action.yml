name: SignPath inputs
description: Upload a release's unsigned Windows packages for the windows-sign job
inputs:
  target:
    description: Rust target triple
    required: true
  artifact:
    description: Release artifact basename
    required: true
  version:
    description: Release version
    required: true
  mode:
    description: cli, headless or application
    required: true
  identity-name:
    description: Existing MSIX package identity name
    required: true
  display-name:
    description: Existing application display name
    required: true
  publisher:
    description: Exact Subject of the SignPath production certificate
    required: true
  zip:
    description: Also upload the portable ZIP, whose executable SignPath signs
    required: true
runs:
  using: composite
  steps:
    - name: Upload unsigned portable ZIP
      if: ${{ inputs.zip == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: signpath-${{ inputs.artifact }}.zip
        path: dist/release/${{ inputs.artifact }}.zip
        if-no-files-found: error
        retention-days: 7
    # The release MSIX carries the signing certificate's Subject as Publisher;
    # the Store submission keeps its Partner Center identity.
    - name: Package MSIX with the signing certificate publisher
      shell: pwsh
      env:
        TARGET: ${{ inputs.target }}
        ARTIFACT: ${{ inputs.artifact }}
        VERSION: ${{ inputs.version }}
        MODE: ${{ inputs.mode }}
        IDENTITY: ${{ inputs.identity-name }}
        DISPLAY: ${{ inputs.display-name }}
        PUBLISHER: ${{ inputs.publisher }}
      run: |
        scripts/package-windows-msix.ps1 -Target $env:TARGET -Artifact $env:ARTIFACT -Version $env:VERSION `
          -Mode $env:MODE -OutputDir dist/signpath-msix -IdentityName $env:IDENTITY -DisplayName $env:DISPLAY `
          -Publisher $env:PUBLISHER -PublisherDisplayName 'SignPath Foundation'
    - name: Upload unsigned release MSIX
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: signpath-${{ inputs.artifact }}.msix
        path: dist/signpath-msix/${{ inputs.artifact }}.msix
        if-no-files-found: error
        retention-days: 7
