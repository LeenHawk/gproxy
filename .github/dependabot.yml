version: 2

# Minor and patch updates only. `update-types` is honoured under `ignore`
# (and `groups`), not under `allow`, so majors are ignored rather than
# minors and patches allowed.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directories:
      - "/console"
      - "/docs"
      - "/deploy/cloudflare"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Keeps pinned action commits current. Dependency updates require human review.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
