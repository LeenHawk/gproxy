name: Prepare mobile store packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to prepare (no store submission)
        type: choice
        options: [all, android, harmonyos]
        default: all

permissions:
  contents: read

env:
  # dtolnay/rust-toolchain retries only checksum errors; rustup retries network ones.
  RUSTUP_MAX_RETRIES: 10

jobs:
  android:
    if: inputs.platform != 'harmonyos'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.12'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # 1.99.0
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ libclang-dev make pkg-config ninja-build
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'build-tools;34.0.0' 'ndk;30.0.15729638'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"
      - name: Build pinned Android UPX
        run: bash scripts/install-android-upx.sh
      - name: Install locked JavaScript dependencies
        run: |
          pnpm --dir console install --frozen-lockfile
          pnpm --dir crates/gproxy-host-tauri install --frozen-lockfile
      - uses: ./.github/actions/ghcr-rust-cache
        with:
          key: android-store-preparation-universal
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and inspect unsigned store packages
        run: |
          pnpm --dir console build
          export GPROXY_ANDROID_FRONTEND_READY=1
          for channel in fdroid google-play appgallery; do
            bash scripts/mobile/build-android.sh "$channel" universal
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-android-universal-unsigned
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 14

  harmonyos:
    if: inputs.platform != 'android'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned HarmonyOS toolchain container
        run: docker build -t gproxy-store-ohos -f .gitlab/Dockerfile.ohos .
      - name: Build unsigned AppGallery APP and device-test HAP
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace gproxy-store-ohos bash -ec '
            git config --global --add safe.directory /workspace
            pnpm --dir console install --frozen-lockfile
            bash scripts/mobile/build-ohos.sh
          '
      - name: Sign and verify AppGallery packages
        env:
          OHOS_SIGNING_MATERIAL: ${{ secrets.OHOS_SIGNING_MATERIAL }}
          OHOS_SIGNING_PASSWORD: ${{ secrets.OHOS_SIGNING_PASSWORD }}
        run: |
          docker run --rm --network none --env OHOS_SIGNING_MATERIAL --env OHOS_SIGNING_PASSWORD \
            -v "$PWD/scripts/ohos/sign-hap.py:/sign.py:ro" -v "$PWD/dist/mobile/appgallery-ohos:/packages" \
            -w /packages gproxy-store-ohos bash -ec '
              tool="$OHOS_HOME/toolchains/lib/hap-sign-tool.jar"
              mkdir -p signed
              python3 /sign.py gproxy-appgallery-ohos-unsigned.app signed/gproxy-appgallery-ohos.app --tool "$tool" --release-env
              for hap in *.hap; do python3 /sign.py "$hap" "signed/$hap" --tool "$tool" --release-env; done
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-appgallery-harmonyos-arm64
          path: dist/mobile/appgallery-ohos/signed/
          if-no-files-found: error
          retention-days: 14
