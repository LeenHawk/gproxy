name: Prepare mobile store packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to prepare (unsigned; no store submission)
        type: choice
        options: [all, android, harmonyos]
        default: all

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform != 'harmonyos'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        channel: [fdroid, google-play, appgallery]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ libclang-dev make pkg-config ninja-build
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'ndk;30.0.15729638'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> "$GITHUB_ENV"
      - name: Build pinned Android UPX
        run: bash scripts/install-android-upx.sh
      - name: Install locked JavaScript dependencies
        run: |
          pnpm --dir console install --frozen-lockfile
          pnpm --dir crates/gproxy-host-tauri install --frozen-lockfile
      - name: Build and inspect unsigned store packages
        env:
          STORE_CHANNEL: ${{ matrix.channel }}
        run: bash scripts/mobile/build-android.sh "$STORE_CHANNEL" aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-${{ matrix.channel }}-arm64-unsigned
          path: dist/mobile/${{ matrix.channel }}/aarch64/
          if-no-files-found: error
          retention-days: 14

  harmonyos:
    if: inputs.platform != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned HarmonyOS toolchain container
        run: docker build -t gproxy-store-ohos -f .gitlab/Dockerfile.ohos .
      - name: Build unsigned AppGallery APP and device-test HAP
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace gproxy-store-ohos bash -lc '
            git config --global --add safe.directory /workspace
            pnpm --dir console install --frozen-lockfile
            bash scripts/mobile/build-ohos.sh
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-appgallery-harmonyos-arm64-unsigned
          path: dist/mobile/appgallery-ohos/
          if-no-files-found: error
          retention-days: 14
