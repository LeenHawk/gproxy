name: Publish Microsoft Store

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string
      run_id:
        description: Release workflow run containing the MSIX artifacts
        required: true
        type: string
      prepare_only:
        description: Prepare packages for manual first submission without submitting
        type: boolean
        default: false
      repackage:
        description: Repackage the stable release ZIPs using the current Store identities
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      MS_STORE_CLIENT_SECRET:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: microsoft-store-${{ vars.MS_STORE_PRODUCT_ID }}
  cancel-in-progress: false

jobs:
  submit:
    name: ${{ matrix.edition }} Microsoft Store
    runs-on: windows-latest
    environment: ${{ inputs.prepare_only && 'store-packaging' || 'release' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: Desktop
            mode: application
            artifact_prefix: gproxy-tauri-windows
            executable: gproxy-desktop.exe
            product_id: ${{ vars.MS_STORE_PRODUCT_ID }}
            identity_name: ${{ vars.MS_STORE_IDENTITY_NAME }}
            display_name: ${{ vars.MS_STORE_DISPLAY_NAME }}
          - edition: CLI
            mode: cli
            artifact_prefix: gproxy-windows
            executable: gproxy.exe
            product_id: ${{ vars.MS_STORE_CLI_PRODUCT_ID }}
            identity_name: ${{ vars.MS_STORE_CLI_IDENTITY_NAME }}
            display_name: ${{ vars.MS_STORE_CLI_DISPLAY_NAME }}
    env:
      MS_STORE_PRODUCT_ID: ${{ matrix.product_id }}
      MS_STORE_TENANT_ID: ${{ vars.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ vars.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ vars.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ !inputs.prepare_only && secrets.MS_STORE_CLIENT_SECRET || '' }}
      MS_STORE_IDENTITY_NAME: ${{ matrix.identity_name }}
      MS_STORE_DISPLAY_NAME: ${{ matrix.display_name }}
      MS_STORE_IDENTITY_PUBLISHER: ${{ vars.MS_STORE_IDENTITY_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate source release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id || github.run_id }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const run = (await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.SOURCE_RUN_ID) })).data;
            if (run.path !== '.github/workflows/release.yml' || run.event !== 'push' || run.head_branch !== tag) {
              throw new Error('MSIX artifacts must come from the selected tagged Release workflow');
            }
            const release = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            if (release.draft || release.prerelease) throw new Error('A public stable release is required');
            let object = (await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` })).data.object;
            if (object.type === 'tag') object = (await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha })).data.object;
            if (object.type !== 'commit' || object.sha !== run.head_sha) throw new Error('Release tag and artifact source commit do not match');
      - name: Validate Store configuration
        shell: pwsh
        run: |
          foreach ($name in @('MS_STORE_PRODUCT_ID', 'MS_STORE_IDENTITY_NAME', 'MS_STORE_DISPLAY_NAME', 'MS_STORE_IDENTITY_PUBLISHER', 'MS_STORE_PUBLISHER_DISPLAY_NAME')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
          }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !inputs.repackage }}
        with:
          pattern: microsoft-store-unsigned-${{ matrix.artifact_prefix }}-*
          path: dist/store
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repackage published binaries for the current Store identity
        if: ${{ inputs.repackage }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
          EXECUTABLE: ${{ matrix.executable }}
          PACKAGE_MODE: ${{ matrix.mode }}
        run: scripts/repackage-store-release.ps1 -Version $env:VERSION
      - name: Bundle Windows architectures
        shell: pwsh
        env:
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: scripts/bundle-windows-msix.ps1 -Version $env:VERSION -ArtifactPrefix $env:ARTIFACT_PREFIX
      - name: Preserve ready-to-upload Store packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: microsoft-store-${{ matrix.edition }}-${{ inputs.version }}
          path: dist/store-upload/*.msixbundle
          if-no-files-found: error
          retention-days: 30
      - name: Set up Microsoft Store CLI
        if: ${{ !inputs.prepare_only }}
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.2
      - name: Authenticate with Partner Center
        if: ${{ !inputs.prepare_only }}
        shell: pwsh
        run: |
          foreach ($name in @('MS_STORE_TENANT_ID', 'MS_STORE_SELLER_ID', 'MS_STORE_CLIENT_ID', 'MS_STORE_CLIENT_SECRET')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
          }
          msstore reconfigure --tenantId $env:MS_STORE_TENANT_ID --sellerId $env:MS_STORE_SELLER_ID --clientId $env:MS_STORE_CLIENT_ID --clientSecret $env:MS_STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msstore settings --enableTelemetry false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload and submit Store update
        if: ${{ !inputs.prepare_only }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish-microsoft-store.ps1 -Version $env:VERSION
