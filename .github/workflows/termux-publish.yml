name: Submit Termux release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version (for example 4.0.3)
        required: true
        type: string
      dry_run:
        description: Validate without updating the fork or PR
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: termux-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package lint tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xxd jq
      - name: Submit or update Termux PR
        env:
          GH_TOKEN: ${{ secrets.TERMUX_TOKEN || github.token }}
          TERMUX_TOKEN: ${{ secrets.TERMUX_TOKEN }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          options=()
          if [ "$DRY_RUN" = true ]; then
            options+=(--dry-run)
          elif [ -z "$TERMUX_TOKEN" ]; then
            echo 'Configure TERMUX_TOKEN in the release environment.' >&2
            exit 1
          fi
          python scripts/termux-submit.py --version "$VERSION" "${options[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: termux-submission-${{ inputs.version }}
          path: dist/termux/
          if-no-files-found: ignore
          retention-days: 14
