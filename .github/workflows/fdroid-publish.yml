name: Submit F-Droid release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version (for example 4.0.3)
        required: true
        type: string
      dry_run:
        description: Validate without changing GitLab
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fdroid-submission
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install F-Droid metadata tools
        run: >-
          python -m pip install
          'fdroidserver @ git+https://gitlab.com/fdroid/fdroidserver.git@c21c177ff6d813697aaf9c988ca9fbb2b571b468'
          'ruamel.yaml==0.18.10'
      - name: Verify submission lifecycle
        run: python -m unittest discover -s scripts/mobile -p 'test_fdroid_submit.py'
      - name: Submit or update the F-Droid merge request
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          options=()
          if [ "$DRY_RUN" = true ]; then options+=(--dry-run); fi
          python scripts/mobile/fdroid-submit.py --version "$VERSION" "${options[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fdroid-${{ inputs.version }}
          path: dist/mobile/fdroid/metadata/
          if-no-files-found: error
          retention-days: 14
