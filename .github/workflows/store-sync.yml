name: Sync Microsoft Store signed MSIX

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate available Store packages without replacing release assets
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    concurrency:
      group: gproxy-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check synchronization behavior
        shell: pwsh
        run: scripts/test-sync-store-msix.ps1
      - name: Replace unsigned MSIX in the ten latest stable releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
          MS_STORE_CLI_PRODUCT_ID: ${{ vars.MS_STORE_CLI_PRODUCT_ID }}
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_CLI_IDENTITY_NAME: ${{ vars.MS_STORE_CLI_IDENTITY_NAME }}
          MS_STORE_IDENTITY_PUBLISHER: ${{ vars.MS_STORE_IDENTITY_PUBLISHER }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: scripts/sync-store-msix.ps1 -DryRun:($env:DRY_RUN -eq 'true')
