name: Sync Microsoft Store signed MSIX

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate available Store packages without replacing release assets
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    concurrency:
      group: gproxy-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check synchronization behavior
        shell: pwsh
        run: scripts/test-sync-store-msix.ps1
      - name: Replace unsigned MSIX in the ten latest stable releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
          MS_STORE_CLI_PRODUCT_ID: ${{ vars.MS_STORE_CLI_PRODUCT_ID }}
          MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          MS_STORE_CLI_IDENTITY_NAME: ${{ vars.MS_STORE_CLI_IDENTITY_NAME }}
          MS_STORE_IDENTITY_PUBLISHER: ${{ vars.MS_STORE_IDENTITY_PUBLISHER }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: scripts/sync-store-msix.ps1 -DryRun:($env:DRY_RUN -eq 'true') -WingetReadyPath store-winget-ready.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !inputs.dry_run }}
        with:
          python-version: '3.12'
      - name: Prepare WinGet signed MSIX updates
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not install manifest dependencies.' }
          $ready = @(Get-Content store-winget-ready.json -Raw | ConvertFrom-Json)
          foreach ($item in $ready) {
            python scripts/prepare-winget.py --version $item.Version --edition $item.Edition --skip-existing --output "dist/store-winget/$($item.Version)"
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare signed WinGet manifests.' }
          }
      - name: Save signed WinGet manifests
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-store-signed
          path: dist/store-winget/*/manifests
          if-no-files-found: ignore
      - name: Submit signed MSIX WinGet pull requests
        if: ${{ !inputs.dry_run && hashFiles('dist/store-winget/*/manifests/**/*.yaml') != '' }}
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (!$env:WINGET_CREATE_GITHUB_TOKEN) { throw 'Configure the WINGET_TOKEN repository secret.' }
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile "$env:RUNNER_TEMP/wingetcreate.exe"
          # Pinned digest of the v1.12.13.0 asset: this step holds the publisher token.
          $tool = Get-Item "$env:RUNNER_TEMP/wingetcreate.exe"
          if ((Get-FileHash $tool -Algorithm SHA256).Hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') { throw 'wingetcreate.exe digest mismatch.' }
          $signature = Get-AuthenticodeSignature $tool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'wingetcreate.exe is not Microsoft-signed.' }
          foreach ($version in Get-ChildItem dist/store-winget -Directory) {
            foreach ($edition in Get-ChildItem (Join-Path $version.FullName 'manifests') -Directory -ErrorAction SilentlyContinue) {
              $title = "Microsoft-signed MSIX: LeenHawk.GPROXY.$($edition.Name) version $($version.Name)"
              & "$env:RUNNER_TEMP/wingetcreate.exe" submit --no-open --prtitle $title $edition.FullName
              if ($LASTEXITCODE -ne 0) { throw "WinGet submission failed: $title" }
            }
          }
