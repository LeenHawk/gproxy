name: Tidy release assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version
        required: true
        type: string
      repair_gitlab_manifests:
        description: Repair the stable release and matching GitLab channel manifests
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: gproxy-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Consolidate release checksums on all mirrors
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITLAB_RELEASE_TOKEN: ${{ secrets.GITLAB_RELEASE_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CI_COMMIT_SHA: ${{ github.sha }}
          CI_PROJECT_ID: '86976712'
          CI_API_V4_URL: https://gitlab.com/api/v4
          CI_PROJECT_URL: https://gitlab.com/leenhawk1/gproxy
          CI_PIPELINE_ID: release-metadata-${{ github.run_id }}
          REPAIR_GITLAB_MANIFESTS: ${{ inputs.repair_gitlab_manifests }}
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          args=()
          if [ "$REPAIR_GITLAB_MANIFESTS" = true ]; then args+=(--repair-gitlab-manifests); fi
          python3 scripts/gitlab/clean-release-assets.py "$VERSION" "${args[@]}"
