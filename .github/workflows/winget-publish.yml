name: Submit WinGet packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version (for example 4.0.0)
        required: true
        type: string
      dry_run:
        description: Validate manifests without submitting pull requests
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: winget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        edition: [Desktop, CLI, Headless]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install manifest validation dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Generate and validate manifests from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EDITION: ${{ matrix.edition }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          $options = @()
          if ($env:DRY_RUN -ne 'true') { $options += '--skip-existing' }
          python scripts/prepare-winget.py --version "$env:VERSION" --edition "$env:EDITION" @options
          if ($LASTEXITCODE -ne 0) { throw 'Manifest preparation failed.' }
      - name: Save manifests for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-${{ matrix.edition }}-${{ inputs.version }}
          path: dist/winget/manifests/${{ matrix.edition }}
          if-no-files-found: ignore
      - name: Submit pull request with Microsoft WinGet Create
        if: ${{ !inputs.dry_run && hashFiles(format('dist/winget/manifests/{0}/*.yaml', matrix.edition)) != '' }}
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EDITION: ${{ matrix.edition }}
        run: |
          if (!$env:WINGET_CREATE_GITHUB_TOKEN) { throw 'Configure the WINGET_TOKEN repository secret.' }
          $package = "LeenHawk.GPROXY.$env:EDITION"
          $root = "manifests/l/LeenHawk/GPROXY/$env:EDITION"
          # A package keeps one pending pull request: move an open one to this
          # version instead of opening another next to it.
          $env:GH_TOKEN = $env:WINGET_CREATE_GITHUB_TOKEN
          $user = gh api user | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the WINGET_TOKEN user.' }
          $open = @(gh pr list --repo microsoft/winget-pkgs --author $user.login --state open --search "$package in:title" --json number,title,headRefName,headRepositoryOwner | ConvertFrom-Json |
            Where-Object { $_.title -match "^(New package|New version): $([regex]::Escape($package)) version " -and $_.headRepositoryOwner.login -eq $user.login })
          if ($LASTEXITCODE -ne 0) { throw 'Could not list open WinGet pull requests.' }
          if ($open.Count -gt 1) { throw "More than one open WinGet pull request for ${package}: $($open.number -join ', ')" }
          if ($open.Count -eq 1) {
            $pr = $open[0]
            # Only the version directories this pull request adds are replaced;
            # versions already merged upstream stay on the branch.
            $stale = @(gh api --paginate "repos/microsoft/winget-pkgs/pulls/$($pr.number)/files" --jq '.[].filename' |
              Where-Object { $_.StartsWith("$root/", [StringComparison]::Ordinal) } | ForEach-Object { Split-Path $_ -Parent } | Sort-Object -Unique)
            if ($LASTEXITCODE -ne 0) { throw "Could not list files of pull request $($pr.number)." }
            $work = Join-Path $env:RUNNER_TEMP winget-pkgs
            git clone --quiet --depth 1 --filter=blob:none --sparse --branch $pr.headRefName "https://x-access-token:$env:WINGET_CREATE_GITHUB_TOKEN@github.com/$($user.login)/winget-pkgs.git" $work
            if ($LASTEXITCODE -ne 0) { throw "Could not clone $($pr.headRefName)." }
            git -C $work sparse-checkout set $root
            foreach ($directory in $stale) { git -C $work rm -r -q --ignore-unmatch -- $directory.Replace('\', '/') }
            $target = Join-Path $work "$root/$env:VERSION"
            New-Item -ItemType Directory -Force $target | Out-Null
            Copy-Item "dist/winget/manifests/$env:EDITION/*.yaml" $target
            git -C $work add -- $root
            $kind = $pr.title.Split(':')[0]
            $title = "${kind}: $package version $env:VERSION"
            git -C $work -c user.name=$($user.login) -c user.email="$($user.id)+$($user.login)@users.noreply.github.com" commit -q -m $title
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the updated manifests.' }
            git -C $work push -q origin HEAD
            if ($LASTEXITCODE -ne 0) { throw "Could not push $($pr.headRefName)." }
            gh pr edit $pr.number --repo microsoft/winget-pkgs --title $title
            if ($LASTEXITCODE -ne 0) { throw "Could not retitle pull request $($pr.number)." }
            Write-Host "Updated microsoft/winget-pkgs#$($pr.number) to $env:VERSION."
            exit 0
          }
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe -OutFile "$env:RUNNER_TEMP/wingetcreate.exe"
          # Pinned digest of the v1.28.1.0 asset: this step holds the publisher token.
          $tool = Get-Item "$env:RUNNER_TEMP/wingetcreate.exe"
          if ((Get-FileHash $tool -Algorithm SHA256).Hash -ne '63D980BA79E97042395BD6EB5992C2DB9E01E9E7A8A22958A95C288F27310413') { throw 'wingetcreate.exe digest mismatch.' }
          $signature = Get-AuthenticodeSignature $tool
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'wingetcreate.exe is not Microsoft-signed.' }
          # winget-pkgs titles a package's first submission differently.
          gh api "repos/microsoft/winget-pkgs/contents/manifests/l/LeenHawk/GPROXY/$env:EDITION" --silent 2>$null
          $kind = if ($LASTEXITCODE -eq 0) { 'New version' } else { 'New package' }
          & "$env:RUNNER_TEMP/wingetcreate.exe" submit --no-open --prtitle "${kind}: LeenHawk.GPROXY.$env:EDITION version $env:VERSION" "dist/winget/manifests/$env:EDITION"
          if ($LASTEXITCODE -ne 0) { throw "WinGet Create failed: $LASTEXITCODE" }
