name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Console (typecheck · test · build · i18n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: i18n parity
        run: pnpm i18n:check

      # Builds the SPA and syncs dist/ -> ../assets/console (reads version from
      # ../Cargo.toml + git short SHA). assets/console is gitignored, so this only
      # validates the build succeeds.
      - name: Build
        run: pnpm build

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - name: Validate notifications feed
        run: node scripts/check-notifications.mjs

      - name: Build
        run: npm run build

  # Restore v1's docs deploy: on push to the default branch, build the docs site
  # and publish it to Cloudflare Pages (PRs only build, above). Same secrets +
  # wrangler-action as v1's `deploy-docs-cloudflare`.
  deploy-docs-cloudflare:
    name: Deploy Docs (Cloudflare Pages)
    if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - name: Build docs
        run: npm run build

      - name: Sign notifications feed
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY_B64" ]; then
            echo "UPDATE_SIGNING_PRIVATE_KEY_B64 is empty; skipping notifications signature"
            exit 0
          fi
          [ -n "$UPDATE_SIGNING_PUBLIC_KEY_B64" ] || { echo "UPDATE_SIGNING_PUBLIC_KEY_B64 is empty" >&2; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_B64" | base64 -d > "$work/priv.pem"
          chmod 600 "$work/priv.pem"
          derived="$(openssl pkey -in "$work/priv.pem" -pubout -outform DER | tail -c 32 | base64 -w0)"
          [ "$derived" = "$UPDATE_SIGNING_PUBLIC_KEY_B64" ] || {
            echo "private key does not match UPDATE_SIGNING_PUBLIC_KEY_B64" >&2; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$work/priv.pem" \
            -in dist/notifications.json -out "$work/sig.bin"
          base64 -w0 "$work/sig.bin" > dist/notifications.json.sig
          openssl pkey -in "$work/priv.pem" -pubout -out "$work/pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$work/pub.pem" \
            -sigfile "$work/sig.bin" -in dist/notifications.json >/dev/null || {
            echo "self-verify of notifications signature failed" >&2; exit 1; }

      - name: Deploy docs to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_ID: ${{ secrets.CLOUDFLARE_PROJECT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "docs"
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_ID }}

  backend:
    name: Backend (fmt · clippy · test · edge-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (stable + clippy/rustfmt + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: External channel example format check
        run: cargo fmt --manifest-path examples/external-channel/Cargo.toml --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --features full --all-targets -- -D warnings

      - name: External channel example Clippy
        env:
          CARGO_TARGET_DIR: target/external-channel
        run: cargo clippy --manifest-path examples/external-channel/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --features full

      - name: External channel registration test
        env:
          CARGO_TARGET_DIR: target/external-channel
        run: cargo test --manifest-path examples/external-channel/Cargo.toml -p gproxy-example-channel-bin --test linked_registration

      # Canonical edge build: lib-only, no default features, edge feature, wasm
      # target (the native deps must NOT leak into the worker).
      - name: Edge wasm check
        run: cargo check --lib --no-default-features --features edge --target wasm32-unknown-unknown

      # The release tag publishes these five to crates.io (scripts/publish-crates.sh).
      # Packaging them here catches missing metadata / files excluded from the
      # .crate archive on the PR instead of mid-release. One invocation so the
      # intra-workspace path deps resolve against the crates being packaged.
      - name: Package publishable crates
        run: cargo package -p gproxy-protocol-macros -p gproxy-protocol -p gproxy-transform -p gproxy-channel-api -p gproxy-tokenize
