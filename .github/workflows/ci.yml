name: CI

on:
  push:
  pull_request:

# Read-only unless a job says otherwise; the repository default may be write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (fmt · clippy · test · wasm)
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: console-dist
          path: crates/gproxy-host-axum/assets/web
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: true
      - run: cargo fmt --all --check
      # No `--workspace` on the next two, on purpose. They build the root
      # manifest's `default-members`, which is every crate except the desktop
      # shell; the comment there explains why the shell is excluded, and the
      # `desktop` job below is the other half of that same decision. Between
      # the two jobs every member is still linted and tested.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # This step used to be `cargo check --workspace --target
      # wasm32-unknown-unknown`, and it could never have passed. The workspace
      # now holds the CLI and the desktop shell, and both reach tokio's `net`
      # feature, so mio stops the build outright: "This wasm target is
      # unsupported by mio." Neither belongs in a browser or a Worker.
      #
      # What must stay wasm-clean is the engine and the two hosts that actually
      # deploy there. Every crate below claims that property in its own README;
      # this list is that claim, enforced.
      - name: wasm (default features)
        run: >
          cargo check --target wasm32-unknown-unknown
          -p gproxy-protocol -p gproxy-store -p gproxy-seaorm -p gproxy-client
          -p gproxy-cache -p gproxy-channel -p gproxy-core -p gproxy-file
          -p gproxy-tokenizer -p gproxy-sdk -p gproxy-app -p gproxy-host-axum
          -p gproxy-host-edge
      # The non-default feature sets the READMEs document as wasm-clean, one
      # invocation each because cargo unifies features across a single
      # invocation and these are deliberately different answers. `gproxy-sdk`'s
      # `postgres` and `mysql` are native-only and are not here; `gproxy-file`'s
      # `fs` is native-only, which is why its check drops the default set.
      # `gproxy-channel` and `gproxy-host-edge` are `--lib` because their tests
      # are native by design.
      - name: wasm (documented feature sets)
        run: |
          cargo check --target wasm32-unknown-unknown -p gproxy-sdk --features libsql
          cargo check --target wasm32-unknown-unknown -p gproxy-cache --all-features
          cargo check --target wasm32-unknown-unknown -p gproxy-file --no-default-features --features s3
          cargo check --target wasm32-unknown-unknown -p gproxy-channel --all-features --lib

  # The other half of the root manifest's `default-members` decision. wry,
  # webkit2gtk and gtk are ~180 transitive crates that say nothing about the
  # engine, and a runner cannot build them at all without these headers — so
  # the shell is checked here instead of taxing every backend run with an apt
  # install and a cold build of all of it.
  #
  # `tao` links D-Bus; the system tray also needs AppIndicator headers.
  # The tests themselves need no D-Bus session, no keychain and no display —
  # `tests/assembly.rs` drives `Desktop::start` against a temp directory with
  # the in-memory `SecretStore`, and `tests/table.rs` drives Tauri's
  # `MockRuntime`. This runner needs the headers to compile, not to run.
  desktop:
    name: Desktop shell (clippy · test)
    needs: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: console-dist
          path: crates/gproxy-host-axum/assets/web
      # The window's copy, laid out as `console/scripts/sync-to-embed.mjs`
      # lays it out: the bundle under `ui/console/`, its page at `ui/`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: console-dist
          path: crates/gproxy-host-tauri/ui/console
      - run: cp crates/gproxy-host-tauri/ui/console/index.html crates/gproxy-host-tauri/ui/index.html
      - name: Install desktop toolkit headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-shell
      - run: cargo clippy -p gproxy-host-tauri --all-targets -- -D warnings
      - run: cargo test -p gproxy-host-tauri

  console:
    name: Console (typecheck · test · build · i18n)
    runs-on: ubuntu-latest
    outputs:
      windows_matrix: ${{ steps.windows-matrix.outputs.matrix }}
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Windows build matrix
        id: windows-matrix
        run: |
          echo "matrix=$(jq -c '{include: [.include[] | select(.os == "windows")]}' ../scripts/release-targets.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm i18n:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: console-dist
          path: console/dist
          retention-days: 1

  windows:
    name: Windows packages (${{ matrix.target }})
    needs: console
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.console.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: console-dist
          path: crates/gproxy-host-axum/assets/web
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: console-dist
          path: console/dist
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: crates/gproxy-host-tauri/pnpm-lock.yaml
      - name: Prepare application assets and CLI
        shell: bash
        run: |
          node console/scripts/sync-to-embed.mjs
          pnpm --dir crates/gproxy-host-tauri install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-packages-${{ matrix.target }}
      - name: Release version
        id: version
        shell: bash
        run: echo "version=$(scripts/release-metadata.sh version)" >> "$GITHUB_OUTPUT"
      - name: Build Windows executable
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          GPROXY_BUILD_VERSION: ${{ steps.version.outputs.version }}
          GPROXY_BUILD_CHANNEL: development
          GPROXY_BUILD_HASH: ${{ github.sha }}
          GPROXY_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
          TARGET: ${{ matrix.target }}
        run: scripts/build-windows-release.ps1 -Target $env:TARGET
      - name: Install release packer
        if: ${{ matrix.upx }}
        shell: bash
        env:
          UPX_VERSION: ${{ matrix.upx_version }}
        run: scripts/install-upx.sh
      - name: Pack and verify Windows executable
        if: ${{ matrix.upx }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/gproxy.exe"
          upx --best --lzma "$binary"
          upx --test "$binary"
      - name: Smoke check Windows executable
        if: ${{ matrix.run_check }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          & "target/$env:TARGET/release/gproxy.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "target/$env:TARGET/release/gproxy.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable archive
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: scripts/package-native-release.ps1
      - name: Build Windows application
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          GPROXY_BUILD_VERSION: ${{ steps.version.outputs.version }}
          GPROXY_BUILD_CHANNEL: dev
          GPROXY_BUILD_HASH: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          config="$(jq -cn --arg version "$GPROXY_BUILD_VERSION" '{version:$version}')"
          pnpm --dir crates/gproxy-host-tauri exec tauri build --ci --target "$TARGET" --no-bundle --config "$config" -- --locked
      - name: Validate application Store packaging
        if: ${{ !contains(steps.version.outputs.version, '-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/windows-store
        with:
          target: ${{ matrix.target }}
          artifact: gproxy-tauri-windows-${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x86_64' || 'aarch64' }}
          version: ${{ steps.version.outputs.version }}
          identity-name: ${{ vars.MS_STORE_IDENTITY_NAME }}
          display-name: ${{ vars.MS_STORE_DISPLAY_NAME }}
          publisher: ${{ vars.MS_STORE_IDENTITY_PUBLISHER }}
          publisher-display-name: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-dist
          path: docs/dist
          retention-days: 1

  # The site is also the host of the signed announcement feed the native
  # binary polls (notifications.json + .sig), so the deploy signs the feed
  # with the same Ed25519 identity the release workflow compiles into the
  # binary. The Pages project's production-branch setting decides whether a
  # branch deploy is production or a preview.
  deploy-docs:
    name: Deploy docs
    needs: docs
    if: ${{ github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch || github.ref_name == '3.0') }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-dist
          path: dist
      - name: Sign notifications feed
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          if [ -z "$UPDATE_SIGNING_PRIVATE_KEY_B64" ]; then
            echo "UPDATE_SIGNING_PRIVATE_KEY_B64 is empty; skipping notifications signature"
            exit 0
          fi
          test -n "$UPDATE_SIGNING_PUBLIC_KEY_B64" || { echo "UPDATE_SIGNING_PUBLIC_KEY_B64 is empty" >&2; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_B64" | base64 -d > "$work/priv.pem"
          chmod 600 "$work/priv.pem"
          derived="$(openssl pkey -in "$work/priv.pem" -pubout -outform DER | tail -c 32 | base64 -w0)"
          test "$derived" = "$UPDATE_SIGNING_PUBLIC_KEY_B64" || {
            echo "private key does not match UPDATE_SIGNING_PUBLIC_KEY_B64" >&2; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$work/priv.pem" \
            -in dist/notifications.json -out "$work/sig.bin"
          base64 -w0 "$work/sig.bin" > dist/notifications.json.sig
          openssl pkey -in "$work/priv.pem" -pubout -out "$work/pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$work/pub.pem" \
            -sigfile "$work/sig.bin" -in dist/notifications.json >/dev/null || {
            echo "self-verify of notifications signature failed" >&2; exit 1; }
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_ID }} --branch=${{ github.ref_name }}
