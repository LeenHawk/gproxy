name: CI

on:
  push:
    # A tag points at a commit main's push already tested.
    branches: ['**']
  pull_request:

# Read-only unless a job says otherwise; the repository default may be write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # dtolnay/rust-toolchain retries only checksum errors; rustup retries network ones.
  RUSTUP_MAX_RETRIES: 10

jobs:
  scope:
    name: Not yet tested on main
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # A branch push of a commit main already contains, such as dev pushed
          # right after main, was tested by main's own push.
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...main" --jq .status)"
            if [ "$status" = ahead ] || [ "$status" = identical ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  dev-base:
    name: Dev includes latest main
    if: github.ref == 'refs/heads/dev' || github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD || {
            echo 'Rebase dev on the latest main before pushing.' >&2
            exit 1
          }

  rust:
    name: Rust (${{ matrix.check }})
    permissions:
      contents: read
      packages: write
    needs: console
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [backend, desktop, wasm]
    env:
      # Tests and Clippy retain assertions; omit bulky debugger symbols from
      # their shared build cache. Release profiles are unaffected.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: crates/gproxy-host-axum/assets/web
      # The window's copy, laid out as `console/scripts/sync-to-embed.mjs`
      # lays it out: the bundle under `ui/console/`, its page at `ui/`.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: crates/gproxy-host-tauri/ui/console
      - run: cp crates/gproxy-host-tauri/ui/console/index.html crates/gproxy-host-tauri/ui/index.html
      - name: Install desktop toolkit headers
        if: matrix.check == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev libayatana-appindicator3-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.check != 'wasm'
        with:
          go-version: "1.27.1"
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # 1.99.0
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/ghcr-rust-cache
        with:
          key: linux-${{ matrix.check }}
          restore-key: linux-checks
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo fmt --all --check
        if: matrix.check == 'backend'
      - name: Release publisher regression tests
        if: matrix.check == 'backend'
        run: python3 -m unittest scripts/test_publish.py
      # Independent jobs retain the default, desktop and wasm feature sets.
      # Clippy and tests within each native job still share compiled dependencies.
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.check == 'backend'
      # Not a default member, so the step above skips it. It is the one thing
      # that notices when the public channel contract stops being enough.
      - name: Out-of-tree channel example
        if: matrix.check == 'backend'
        run: cargo clippy -p gproxy-example-channel -p gproxy-example-native --all-targets -- -D warnings
      - run: cargo test
        if: matrix.check == 'backend'
      - run: bash scripts/with-tauri-desktop-lib.sh cargo clippy -p gproxy-host-tauri --all-targets -- -D warnings
        if: matrix.check == 'desktop'
      - run: bash scripts/with-tauri-desktop-lib.sh cargo test -p gproxy-host-tauri
        if: matrix.check == 'desktop'
      # Only the stateless crates stay wasm-capable (with `gproxy-file` and
      # `gproxy-tokenizer`, which their optional features pull in); the rest
      # of the workspace is native-only. `gproxy-lite` is the one deployed as
      # WebAssembly.
      - name: wasm (stateless crates)
        if: matrix.check == 'wasm'
        run: >
          cargo check --target wasm32-unknown-unknown
          -p gproxy-protocol -p gproxy-client -p gproxy-client-sdk -p gproxy-upstream -p gproxy-channel -p gproxy-convert -p gproxy-lite
          --features "gproxy-client/fetch,gproxy-client/workers,gproxy-client-sdk/realtime,gproxy-client-sdk/s3,gproxy-client-sdk/local-count,gproxy-client-sdk/normalize-images,gproxy-channel/aistudio,gproxy-channel/playground,gproxy-channel/antigravity,gproxy-channel/aws_bedrock,gproxy-channel/azure,gproxy-channel/claudeapi,gproxy-channel/claudecode,gproxy-channel/claudeweb,gproxy-channel/cline,gproxy-channel/cloudflare_ai_gateway,gproxy-channel/codex,gproxy-channel/commandcode,gproxy-channel/copilotcli,gproxy-channel/custom,gproxy-channel/dashscope,gproxy-channel/deepseek,gproxy-channel/glm,gproxy-channel/minimax,gproxy-channel/devin,gproxy-channel/geminicli,gproxy-channel/grokbuild,gproxy-channel/kimi,gproxy-channel/kiro,gproxy-channel/nvidia,gproxy-channel/openai,gproxy-channel/opencode,gproxy-channel/opendesign,gproxy-channel/orcaterm,gproxy-channel/openrouter,gproxy-channel/vercel,gproxy-channel/volcengine,gproxy-channel/vertex,gproxy-channel/vertexexpress,gproxy-channel/trae,gproxy-channel/workbuddy,gproxy-channel/xai"

  backend:
    # Preserve main's protected-branch check name while running checks in parallel.
    name: Backend (fmt · clippy · test · wasm)
    needs: [scope, rust]
    if: always() && needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.rust.result }}

  console:
    name: Console (typecheck · test · build · i18n)
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      windows_matrix: ${{ steps.windows-matrix.outputs.matrix }}
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify immutable action references
        working-directory: .
        run: python3 scripts/check-workflow-actions.py
      - name: Windows build matrix
        id: windows-matrix
        run: |
          echo "matrix=$(jq -c '{include: [.include[] | select(.os == "windows")]}' ../scripts/release-targets.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm i18n:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-dist
          path: console/dist
          retention-days: 1

  windows:
    # dev and version-tag pushes already build and validate both Windows
    # packages in Release. PRs and other branches keep this independent check.
    if: github.event_name != 'push' || (github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
    name: Windows packages (${{ matrix.target }})
    needs: console
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.console.outputs.windows_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: crates/gproxy-host-axum/assets/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-dist
          path: console/dist
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: crates/gproxy-host-tauri/pnpm-lock.yaml
      - name: Prepare application assets and CLI
        shell: bash
        run: |
          node console/scripts/sync-to-embed.mjs
          pnpm --dir crates/gproxy-host-tauri install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # 1.99.0
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/ghcr-rust-cache
        with:
          key: packages-${{ matrix.target }}-cli
          restore-key: packages-${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Release version
        id: version
        shell: bash
        run: echo "version=$(scripts/release-metadata.sh version)" >> "$GITHUB_OUTPUT"
      - name: Configure native Windows ARM64 dependencies
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo "CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc=$(cygpath -m "$GITHUB_WORKSPACE/scripts/cmake/windows-arm64.cmake")" >> "$GITHUB_ENV"
      - name: Build Windows executable
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          GPROXY_BUILD_VERSION: ${{ steps.version.outputs.version }}
          GPROXY_BUILD_CHANNEL: development
          GPROXY_BUILD_HASH: ${{ github.sha }}
          GPROXY_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
          TARGET: ${{ matrix.target }}
        run: scripts/build-windows-release.ps1 -Target $env:TARGET
      - name: Install release packer
        if: ${{ matrix.upx }}
        shell: bash
        env:
          UPX_VERSION: ${{ matrix.upx_version }}
        run: scripts/install-upx.sh
      - name: Pack and verify Windows executable
        if: ${{ matrix.upx }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/pack-windows-cli.ps1 -Target $env:TARGET
      - name: Smoke check Windows executable
        if: ${{ matrix.run_check }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          & "target/$env:TARGET/release/gproxy.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "target/$env:TARGET/release/gproxy.exe" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package portable archive
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: scripts/package-native-release.ps1
      - name: Build Windows application
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
          GPROXY_BUILD_VERSION: ${{ steps.version.outputs.version }}
          GPROXY_BUILD_CHANNEL: dev
          GPROXY_BUILD_HASH: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          config="$(jq -cn --arg version "$GPROXY_BUILD_VERSION" '{version:$version}')"
          pnpm --dir crates/gproxy-host-tauri exec tauri build --ci --target "$TARGET" --no-bundle --config "$config" -- --locked
          upx --best --lzma "target/$TARGET/release/gproxy-desktop.exe"
          upx --test "target/$TARGET/release/gproxy-desktop.exe"
      - name: Validate application Store packaging
        if: ${{ !contains(steps.version.outputs.version, '-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: ./.github/actions/windows-store
        with:
          target: ${{ matrix.target }}
          artifact: gproxy-tauri-windows-${{ matrix.target == 'x86_64-pc-windows-msvc' && 'x86_64' || 'aarch64' }}
          version: ${{ steps.version.outputs.version }}
          identity-name: ${{ vars.MS_STORE_IDENTITY_NAME }}
          display-name: ${{ vars.MS_STORE_DISPLAY_NAME }}
          publisher: ${{ vars.MS_STORE_IDENTITY_PUBLISHER }}
          publisher-display-name: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}

  # The documentation is LeenHawk/gproxy-docs, checked out here as `docs/`. Its
  # API, configuration and channel reference is exported from this code, so a
  # push of main commits the export to docs/main. Other refs only check that
  # the export still runs against the same documentation tooling.
  docs-reference:
    name: Docs reference
    permissions:
      contents: read
      packages: write
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' || (github.event_name == 'push' && github.ref_name == 'main') }}
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      PUBLISH: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LeenHawk/gproxy-docs
          ref: main
          path: docs
          ssh-key: ${{ env.PUBLISH == 'true' && secrets.DOCS_DEPLOY_KEY || '' }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # 1.99.0
        with:
          toolchain: 1.99.0
      - uses: ./.github/actions/ghcr-rust-cache
        with:
          key: linux-docs
          restore-key: linux-checks
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - run: node docs/scripts/generate-reference.mjs
      - name: Commit the export to gproxy-docs
        if: ${{ env.PUBLISH == 'true' }}
        working-directory: docs
        run: |
          # Whatever generate-reference.mjs wrote: generated JSON, and on the
          # Mintlify layout the reference snippets rendered from it.
          git add -A
          if git diff --cached --quiet; then echo "reference unchanged"; exit 0; fi
          # The rebase below replays this commit, so it needs the identity too.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "chore(reference): export from gproxy ${GITHUB_SHA::12}"
          # A docs commit may have landed since the checkout; the export only
          # touches public/generated, so replaying it on top is always clean.
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
