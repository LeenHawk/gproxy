name: Reproducible builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: Rust target, or all
        default: all
        required: true
      kind:
        description: cli, headless, application, store-fdroid, store-google-play, store-appgallery, serverless, edge, or all
        default: all
        required: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        env:
          TARGET: ${{ inputs.target || 'all' }}
          KIND: ${{ inputs.kind || 'all' }}
        run: echo "value=$(python3 scripts/reproducible-matrix.py --target "$TARGET" --kind "$KIND")" >> "$GITHUB_OUTPUT"

  rebuild:
    name: ${{ matrix.kind }} (${{ matrix.target }})
    needs: inventory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      KIND: ${{ matrix.kind }}
      CONTAINER: ${{ matrix.container }}
      CARGO_BUILD_JOBS: '2'
      MS_STORE_CLI_IDENTITY_NAME: ${{ vars.MS_STORE_CLI_IDENTITY_NAME }}
      MS_STORE_CLI_DISPLAY_NAME: ${{ vars.MS_STORE_CLI_DISPLAY_NAME }}
      MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      MS_STORE_DISPLAY_NAME: ${{ vars.MS_STORE_DISPLAY_NAME }}
      MS_STORE_IDENTITY_PUBLISHER: ${{ vars.MS_STORE_IDENTITY_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.container == ''
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.container == ''
        with:
          node-version: '24.21.0'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.container == '' && matrix.builder == 'cargo'
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # pinned toolchain
        if: matrix.container == '' && matrix.builder == 'cargo'
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - name: Install native Linux build dependencies
        if: matrix.container == '' && matrix.os == 'linux' && matrix.builder == 'cargo'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libclang-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Worker builder
        if: matrix.kind == 'edge'
        run: cargo install worker-build --locked --version 0.8.7
      - name: Build one toolchain image for both independent builds
        if: matrix.container != ''
        run: |
          case "$CONTAINER" in
            cross) docker build --build-arg TARGET_ARCH=riscv64 -f .gitlab/Dockerfile.linux -t gproxy-reproduce-tools . ;;
            ohos) docker build -f .gitlab/Dockerfile.ohos -t gproxy-reproduce-tools . ;;
            android) docker build -f .gitlab/Dockerfile.android -t gproxy-reproduce-tools . ;;
            *) exit 1 ;;
          esac
          mkdir -p dist/reproducible
          docker image inspect gproxy-reproduce-tools --format '{{.Id}}' > dist/reproducible/toolchain-image.txt
      - name: Build and compare two independent package sets
        run: python scripts/reproduce-build.py --result dist/reproducible -- "$(command -v bash)" scripts/reproduce-dispatch.sh "$TARGET" "$KIND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reproducible-${{ matrix.kind }}-${{ matrix.target }}
          path: dist/reproducible/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-report-${{ matrix.kind }}-${{ matrix.target }}
          path: dist/reproducible/report.json
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Check complete target coverage
    if: always() && !cancelled()
    needs: [inventory, rebuild]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repro-report-*
          path: dist/reproducible-reports
      - name: Require every requested comparison and release package
        env:
          REPRO_MATRIX: ${{ needs.inventory.outputs.matrix }}
          REPRO_FULL_MATRIX: ${{ (inputs.target == '' || inputs.target == 'all') && (inputs.kind == '' || inputs.kind == 'all') }}
        run: python3 scripts/check-reproducible-reports.py dist/reproducible-reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reproducible-coverage
          path: dist/reproducible-summary.json
          retention-days: 14
