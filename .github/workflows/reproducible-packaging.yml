name: Reproducible macOS packaging
on:
  push:
    branches: [build/reproducible-all-platforms]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing two independently built macOS ZIPs
        default: '37283419140'
      artifact:
        default: reproducible-cli-aarch64-apple-darwin
      package:
        default: gproxy-macos-aarch64
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || '37283419140' }}
          name: ${{ inputs.artifact || 'reproducible-cli-aarch64-apple-darwin' }}
          path: dist/macos-input
      - run: bash scripts/install-xorriso.sh
      - name: Repackage and mount-verify both independent inputs
        env:
          PACKAGE: ${{ inputs.package || 'gproxy-macos-aarch64' }}
        run: |
          export SOURCE_DATE_EPOCH="$(python3 -c 'import json; print(json.load(open("dist/macos-input/report.json"))["source_date_epoch"])')"
          work="$RUNNER_TEMP/gproxy-package-check"
          mkdir -p "$work" dist/macos-package-check
          for attempt in first second; do
            mkdir "$work/source"
            unzip -q "dist/macos-input/$attempt/$PACKAGE.zip" -d "$work/source"
            if [[ "$PACKAGE" == gproxy-tauri-* ]]; then
              ln -s /Applications "$work/source/Applications"
              mkdir -p "dist/macos-package-check/$attempt"
              python3 scripts/reproducible-dmg.py --source "$work/source" --volume-name GPROXY --output "dist/macos-package-check/$attempt/$PACKAGE.dmg"
            else
              python3 scripts/package-macos-cli.py --binary "$work/source/gproxy" --artifact "$PACKAGE" --output-dir "dist/macos-package-check/$attempt"
            fi
            rm -rf "$work/source"
          done
          shasum -a 256 "dist/macos-package-check/first/$PACKAGE.dmg" "dist/macos-package-check/second/$PACKAGE.dmg"
          cmp "dist/macos-package-check/first/$PACKAGE.dmg" "dist/macos-package-check/second/$PACKAGE.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-package-check
          path: dist/macos-package-check/
          retention-days: 14
