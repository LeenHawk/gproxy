name: iOS packages

on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths:
      - 'crates/**'
      - 'console/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-ios.sh'
      - 'scripts/package-ios.sh'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [ios]
    paths:
      - 'crates/**'
      - 'console/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-ios.sh'
      - 'scripts/package-ios.sh'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - run: pnpm --dir console install --frozen-lockfile
      - run: pnpm --dir console build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-console-dist
          path: console/dist/
          if-no-files-found: error
          retention-days: 1

  package:
    name: iOS ARM64 (${{ matrix.variant }})
    needs: console
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: device
            target: aarch64-apple-ios
          - variant: simulator
            target: aarch64-apple-ios-sim
    env:
      GPROXY_IOS_SKIP_FRONTEND: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-console-dist
          path: crates/gproxy-host-axum/assets/web
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install native build tools and inspect SDK
        run: |
          brew install xcodegen cmake
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Build Rust gateway and generate Xcode project
        env:
          IOS_TARGET: ${{ matrix.target }}
        run: bash scripts/build-ios.sh "$IOS_TARGET"
      - name: Compile Swift and package app
        env:
          IOS_VARIANT: ${{ matrix.variant }}
        run: bash scripts/package-ios.sh "$IOS_VARIANT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gproxy-ios-arm64-${{ matrix.variant }}
          path: dist/ios/${{ matrix.variant }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gproxy-ios-${{ matrix.variant }}-build-log
          path: dist/ios/logs/${{ matrix.variant }}.log
          if-no-files-found: ignore
          retention-days: 7
