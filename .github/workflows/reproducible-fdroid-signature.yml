name: Verify F-Droid signature reproduction
on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Successful upstream F-Droid reproduction run
        required: true
        type: string
      fdroid_job_id:
        description: Independent fdroiddata build job in project 87163432
        required: true
        type: string
      source_commit:
        description: Exact source commit being verified
        required: true
        type: string
      unsigned_sha256:
        description: Expected SHA-256 of both unsigned APKs
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.upstream_run_id }}
          name: reproducible-store-fdroid-aarch64-linux-android
          path: upstream
      - name: Fetch and compare the independent F-Droid rebuild
        env:
          FDROID_GITLAB_TOKEN: ${{ secrets.FDROID_GITLAB_TOKEN }}
          FDROID_JOB_ID: ${{ inputs.fdroid_job_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          UNSIGNED_SHA256: ${{ inputs.unsigned_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, urllib.request, zipfile
          from pathlib import Path
          report = json.loads(Path('upstream/report.json').read_text())
          assert report['commit'] == os.environ['SOURCE_COMMIT']
          assert report['passed']
          request = urllib.request.Request(
              f"https://gitlab.com/api/v4/projects/87163432/jobs/{int(os.environ['FDROID_JOB_ID'])}/artifacts",
              headers={'PRIVATE-TOKEN': os.environ['FDROID_GITLAB_TOKEN']})
          with urllib.request.urlopen(request) as response:
              with zipfile.ZipFile(io.BytesIO(response.read())) as archive:
                  names = [n for n in archive.namelist() if re.fullmatch(r'tmp/com\.leenhawk\.gproxy\.app_\d+\.apk', n)]
                  assert len(names) == 1
                  rebuilt = archive.read(names[0])
          expected = os.environ['UNSIGNED_SHA256'].lower()
          assert hashlib.sha256(rebuilt).hexdigest() == expected
          assert hashlib.sha256(Path('upstream/first/gproxy-fdroid-aarch64.apk').read_bytes()).hexdigest() == expected
          Path('rebuilt.apk').write_bytes(rebuilt)
          print('Independent GitHub and F-Droid APK SHA256:', expected)
          PY
      - name: Install the documented signature tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
          python3 -m pip install apksigcopier==1.1.1
      - name: Sign the candidate and verify signature copying
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p dist/fdroid-signature
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 -d > "$work/key.jks"
          chmod 600 "$work/key.jks"
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          options=(--ks "$work/key.jks" --ks-pass env:ANDROID_SIGNING_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" --v4-signing-enabled false)
          if [ -n "$ANDROID_SIGNING_KEY_PASSWORD" ]; then options+=(--key-pass env:ANDROID_SIGNING_KEY_PASSWORD); fi
          "$signer" sign "${options[@]}" --out dist/fdroid-signature/gproxy-fdroid-aarch64.apk upstream/first/gproxy-fdroid-aarch64.apk
          curl --fail --location --retry 3 https://github.com/LeenHawk/gproxy/releases/download/v4.1.0/gproxy-tauri-android-aarch64.apk -o "$work/released.apk"
          "$signer" verify --verbose --print-certs "$work/released.apk" > "$work/released-cert.txt"
          fingerprint="$(python3 - "$work/released-cert.txt" <<'PY'
          import re, sys
          values = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]{64})', open(sys.argv[1]).read())
          assert len(values) == 1
          print(values[0])
          PY
          )"
          python3 scripts/mobile/verify-reproducible-apk.py dist/fdroid-signature/gproxy-fdroid-aarch64.apk rebuilt.apk \
            --build-tools "$ANDROID_HOME/build-tools/34.0.0" --expected-cert-sha256 "$fingerprint" \
            --report dist/fdroid-signature/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fdroid-signature-verification
          path: dist/fdroid-signature/
          retention-days: 14
