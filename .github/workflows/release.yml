name: release

# Builds the v2 distribution: native binaries, edge (wasm) bundles, and Docker
# images. Version tags (`vX.Y.Z`) build everything first, then create a draft
# GitHub Release, upload all assets, and publish it only after the manifest is
# present. Every other trigger (push to `main`, manual dispatch) refreshes the
# rolling `staging` tag with commit-namespaced native assets plus a signed
# `staging` manifest keyed by commit identity. Edge bundles and the deploy branch are
# regenerated on every run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  # release.sh pushes main and then a tag at the same commit. Let the tag run
  # replace the redundant staging run before both can refresh `deploy`.
  group: release-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  # Self-heal flaky crates.io downloads on CI runners (the Windows runner hit a
  # transient "connection was reset" pulling a crate). Default retry is 3.
  CARGO_NET_RETRY: "10"
  # Effective publish target. Version tag pushes ship to their own tag on the
  # `releases` (semver) channel; push-to-main and manual dispatch refresh the
  # fixed `staging` tag on the commit-keyed `staging` channel.
  PUBLISH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'staging' }}
  PUBLISH_CHANNEL: ${{ github.ref_type == 'tag' && 'releases' || 'staging' }}
  UPX_VERSION: 5.2.0
  # First upstream revision with win64/arm64 packing support. The released
  # 5.2.0 still reports that format as not implemented.
  UPX_WINDOWS_ARM64_REV: 9d384c7f79b9324feef82e870a6fc3f1cee651ff
  # Enlarges the RISC-V AUIPC tracking table for large executable segments
  # (upx/upx#18885); this fix is newer than the 5.2.0 release.
  UPX_RISCV_REV: 11c2c5227508378d87ed920e9ba6ea8a6378a22b

jobs:
  build-console:
    name: Build console (embed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      # `pnpm build` emits console/dist AND syncs it to ../assets/console via the
      # sync-to-embed.mjs postbuild (the path rust-embed bakes into the binary).
      - name: Build console
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Upload console embed
        uses: actions/upload-artifact@v7
        with:
          name: console-embed
          path: assets/console
          include-hidden-files: true
          retention-days: 1

  build-native:
    name: native ${{ matrix.target }}
    needs: build-console
    runs-on: ${{ matrix.runner }}
    env:
      # Compiled in by option_env!("GPROXY_UPDATE_PUBKEY") in
      # src/selfupdate/verify.rs — lets `apply` verify the signed update
      # manifest. Absent → a placeholder all-zero key that rejects every
      # signature (the secure default).
      GPROXY_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
      # Tagged builds default to stable updates; rolling main builds default to
      # staging. Runtime CLI/env and Console settings can still override this.
      GPROXY_BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'releases' || 'staging' }}
      # Staging compares this embedded identity with the signed manifest's
      # `version`. Tagged builds carry their tag so overriding them to staging
      # still correctly offers the rolling build.
      GPROXY_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: gproxy-linux-x86_64
            ext: ""
            run_check: true
            upx: true
            docker_bin: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            artifact: gproxy-linux-aarch64
            ext: ""
            run_check: true
            upx: true
            docker_bin: true
          - target: riscv64gc-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            cross: true
            artifact: gproxy-linux-riscv64
            ext: ""
            run_check: true
            smoke_container: ghcr.io/cross-rs/riscv64gc-unknown-linux-gnu:0.2.5
            smoke_prefix: /linux-runner riscv64
            upx: true
            docker_bin: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            cross: true
            artifact: gproxy-linux-x86_64-musl
            ext: ""
            run_check: true
            upx: true
            docker_bin: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            cross: true
            artifact: gproxy-linux-aarch64-musl
            ext: ""
            run_check: false
            upx: true
            docker_bin: true
          - target: riscv64gc-unknown-linux-musl
            runner: ubuntu-latest
            os: linux
            cross: true
            artifact: gproxy-linux-riscv64-musl
            ext: ""
            run_check: true
            smoke_container: ghcr.io/cross-rs/riscv64gc-unknown-linux-musl:main
            smoke_prefix: /qemu-runner riscv64
            upx: true
            docker_bin: true
          - target: x86_64-linux-android
            runner: ubuntu-latest
            os: android
            android_abi: x86_64
            artifact: gproxy-android-x86_64
            ext: ""
            run_check: false
            upx: true
            docker_bin: false
          - target: aarch64-linux-android
            runner: ubuntu-latest
            os: android
            android_abi: arm64-v8a
            artifact: gproxy-android-aarch64
            ext: ""
            run_check: false
            upx: true
            docker_bin: false
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: gproxy-windows-x86_64
            ext: ".exe"
            run_check: true
            upx: true
            docker_bin: false
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: gproxy-windows-aarch64
            ext: ".exe"
            run_check: false
            upx: true
            docker_bin: false
          - target: x86_64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: gproxy-macos-x86_64
            ext: ""
            run_check: false
            # UPX still disables macOS 13+ packed-runtime tests because the
            # generated executable crashes (upx/upx#612).
            upx: false
            docker_bin: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: gproxy-macos-aarch64
            ext: ""
            run_check: true
            # Compressing can succeed after removing the Mach-O signature, but
            # the resulting executable is not supported on current macOS.
            upx: false
            docker_bin: false
    steps:
      - uses: actions/checkout@v7

      - name: Validate update signing key present
        run: |
          test -n "${GPROXY_UPDATE_PUBKEY}" || {
            echo "missing repo secret UPDATE_SIGNING_PUBLIC_KEY_B64 — refusing to ship a binary that cannot verify updates" >&2
            exit 1
          }

      - name: Download console embed
        uses: actions/download-artifact@v8
        with:
          name: console-embed
          path: assets/console

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.cross }}
        run: |
          if [ "${{ matrix.target }}" = "riscv64gc-unknown-linux-musl" ]; then
            # RISC-V musl support is newer than the crates.io 0.2.5 release.
            # Pin a reviewed upstream commit so CI also selects the matching
            # ghcr.io/cross-rs/riscv64gc-unknown-linux-musl:main image.
            cargo install cross --git https://github.com/cross-rs/cross \
              --rev 64b5bb4d3d34de062552b9a2093affe77b4ad16a --locked
          else
            cargo install cross --locked
          fi

      - name: Set up Android NDK toolchain
        if: ${{ matrix.os == 'android' }}
        uses: android-actions/setup-android@v4
      - name: Install cargo-ndk
        if: ${{ matrix.os == 'android' }}
        run: cargo install cargo-ndk --locked

      - name: Build (unix)
        if: ${{ matrix.os != 'windows' }}
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin gproxy --target ${{ matrix.target }}
          elif [ "${{ matrix.os }}" = "android" ]; then
            cargo ndk -t ${{ matrix.android_abi }} build --release --bin gproxy
          else
            cargo build --release --bin gproxy --target ${{ matrix.target }}
          fi

      - name: Build (windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --bin gproxy --target ${{ matrix.target }}

      - name: Install UPX + zip (linux)
        if: ${{ matrix.upx && (matrix.os == 'linux' || matrix.os == 'android') }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              host=amd64
              checksum=3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1
              ;;
            aarch64)
              host=arm64
              checksum=55d48a61e8ffd17152db871c855376cba7f08e830b37799d0947a16dff8ec36c
              ;;
            *)
              echo "unsupported UPX host architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/upx.tar.xz"
          curl -fsSL \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-${host}_linux.tar.xz" \
            -o "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 \
            "$RUNNER_TEMP/upx-${UPX_VERSION}-${host}_linux/upx" \
            /usr/local/bin/upx
          if [[ "${{ matrix.target }}" == riscv64gc-* ]]; then
            src="$RUNNER_TEMP/upx-riscv-src"
            build="$RUNNER_TEMP/upx-riscv-build"
            git clone https://github.com/upx/upx.git "$src"
            git -C "$src" checkout --detach "$UPX_RISCV_REV"
            git -C "$src" submodule update --init --recursive --depth 1
            cmake -S "$src" -B "$build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DUPX_CONFIG_DISABLE_SELF_PACK_TEST=ON
            cmake --build "$build" --parallel
            sudo install -m 0755 "$build/upx" /usr/local/bin/upx
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
          upx --version

      - name: Install UPX (windows x86_64)
        if: ${{ matrix.upx && matrix.os == 'windows' && matrix.target != 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "upx.zip"
          $out = Join-Path $env:RUNNER_TEMP "upx"
          Invoke-WebRequest `
            "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip" `
            -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $expected = "b471ebf1b7f20f4a89150264ed9a008a2a5bfd247f3c6d1184a75bb59ca08f5d"
          if ($actual -ne $expected) { throw "UPX checksum mismatch: $actual" }
          Expand-Archive $archive -DestinationPath $out
          $bin = Join-Path $out "upx-$env:UPX_VERSION-win64"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$bin/upx.exe" --version

      - name: Build UPX with Windows ARM64 support
        if: ${{ matrix.upx && matrix.target == 'aarch64-pc-windows-msvc' }}
        env:
          # VS 2026 warns on the pinned revision's doctest internals; upstream
          # uses the same define on its Windows 2026 jobs.
          CXXFLAGS: -DDOCTEST_CONFIG_DISABLE
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/upx-src"
          build="$RUNNER_TEMP/upx-build"
          git clone https://github.com/upx/upx.git "$src"
          git -C "$src" checkout --detach "$UPX_WINDOWS_ARM64_REV"
          git -C "$src" submodule update --init --recursive --depth 1
          cmake -S "$src" -B "$build" -A x64 \
            -DUPX_CONFIG_DISABLE_SELF_PACK_TEST=ON
          cmake --build "$build" --config Release --parallel
          cp "$build/Release/upx.exe" "$RUNNER_TEMP/upx.exe"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/upx.exe" --version

      - name: Install WiX Toolset (windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Smoke check (--help) before UPX — unix
        if: ${{ matrix.run_check && matrix.os != 'windows' }}
        run: |
          if [ -n "${{ matrix.smoke_container }}" ]; then
            docker run --rm -v "$PWD:/project" -w /project \
              "${{ matrix.smoke_container }}" ${{ matrix.smoke_prefix }} \
              ./target/${{ matrix.target }}/release/gproxy --help
          else
            ./target/${{ matrix.target }}/release/gproxy --help
          fi

      - name: Smoke check (--help) before UPX — windows
        if: ${{ matrix.run_check && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/gproxy${{ matrix.ext }}" --help

      - name: Compress binary
        if: ${{ matrix.upx }}
        run: |
          args=(--best --lzma)
          if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            # The initial Windows ARM64 implementation supports NRV only.
            args=(--best)
          fi
          binary=target/${{ matrix.target }}/release/gproxy${{ matrix.ext }}
          upx "${args[@]}" "$binary"
          upx -t "$binary"

      - name: Smoke check (--help) after UPX — unix
        if: ${{ matrix.run_check && matrix.upx && matrix.os != 'windows' }}
        run: |
          if [ -n "${{ matrix.smoke_container }}" ]; then
            docker run --rm -v "$PWD:/project" -w /project \
              "${{ matrix.smoke_container }}" ${{ matrix.smoke_prefix }} \
              ./target/${{ matrix.target }}/release/gproxy --help
          else
            ./target/${{ matrix.target }}/release/gproxy --help
          fi
      - name: Smoke check (--help) after UPX — windows
        if: ${{ matrix.run_check && matrix.upx && matrix.os == 'windows' }}
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/gproxy${{ matrix.ext }}" --help

      - name: Codesign (macos)
        if: ${{ matrix.os == 'macos' }}
        run: codesign --force --sign - target/${{ matrix.target }}/release/gproxy

      # Linux binary for the docker-build job (consumed by its Dockerfile COPY).
      - name: Stage docker binary
        if: ${{ matrix.docker_bin }}
        run: |
          mkdir -p docker-binary
          cp target/${{ matrix.target }}/release/gproxy docker-binary/gproxy
      - name: Upload docker binary
        if: ${{ matrix.docker_bin }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-bin-${{ matrix.target }}
          path: docker-binary/gproxy
          retention-days: 1

      - name: Package zip + sha256 (unix)
        if: ${{ matrix.os != 'windows' }}
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.os }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          ANDROID_APK_PACKAGE_NAME: io.github.leenhawk.gproxy
          ANDROID_APP_LABEL: GPROXY
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ env.PUBLISH_CHANNEL == 'releases' && env.PUBLISH_TAG || github.sha }}
          ANDROID_REQUIRE_SIGNING: ${{ env.PUBLISH_CHANNEL == 'releases' && 'true' || 'false' }}
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          bash scripts/package-native-release.sh

      - name: Package zip + MSI (windows)
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          ./scripts/package-windows-release.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-asset-${{ matrix.target }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            ${{ matrix.artifact }}.apk
            ${{ matrix.artifact }}.apk.sha256
            ${{ matrix.artifact }}.msi
            ${{ matrix.artifact }}.msi.sha256
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.dmg.sha256
            ${{ matrix.artifact }}.deb
            ${{ matrix.artifact }}.deb.sha256
          retention-days: 1

  smoke-windows-arm64:
    name: Smoke Windows ARM64 package
    needs: build-native
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-asset-aarch64-pc-windows-msvc
          path: package
      - name: Run packed binary (--help)
        shell: pwsh
        run: |
          Expand-Archive package/gproxy-windows-aarch64.zip -DestinationPath smoke
          & "smoke/gproxy.exe" --help

  prepare-release-assets:
    name: Prepare signed release assets
    needs: [build-native, smoke-windows-arm64]
    runs-on: ubuntu-latest
    steps:
      # checkout is needed only to read the migration list for
      # min_compatible_data_version (scripts/build-update-manifest.sh).
      - uses: actions/checkout@v7

      # Per-target portable archives + native installers from build-native. No
      # merge: keep the per-triple dirs the signed-manifest script reads.
      - name: Download native package assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-asset-*
          path: dl

      - name: Namespace staging asset filenames
        if: ${{ env.PUBLISH_CHANNEL == 'staging' }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          bash scripts/namespace-release-assets.sh dl "$short"

      - name: Build + sign manifest.json
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
          TAG: ${{ env.PUBLISH_TAG }}
          CHANNEL: ${{ env.PUBLISH_CHANNEL }}
          # Releases derive `version` from the tag; staging uses the commit SHA
          # embedded in the corresponding native binaries.
          VERSION: ${{ env.PUBLISH_CHANNEL == 'releases' && env.PUBLISH_TAG || github.sha }}
          REPO: ${{ github.repository }}
          NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.PUBLISH_TAG }}
          ASSETS_DIR: dl
        run: bash scripts/build-update-manifest.sh

      - name: Collect GitHub Release assets
        run: |
          set -euo pipefail
          mkdir -p publish-assets
          find dl -type f \( \
            -name '*.zip' -o -name '*.zip.sha256' \
            -o -name '*.apk' -o -name '*.apk.sha256' \
            -o -name '*.msi' -o -name '*.msi.sha256' \
            -o -name '*.dmg' -o -name '*.dmg.sha256' \
            -o -name '*.deb' -o -name '*.deb.sha256' \) \
            -exec cp {} publish-assets/ \;
          cp manifest.json publish-assets/
          ls -la publish-assets

      - name: Upload publish asset bundle
        uses: actions/upload-artifact@v7
        with:
          name: publish-assets
          path: publish-assets/*
          retention-days: 1

  build-edge:
    name: Edge wasm bundles
    needs: build-console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-edge

      # wasm-bindgen-cli MUST match the wasm-bindgen crate version in Cargo.lock.
      - name: Install wasm-bindgen-cli
        run: |
          set -euo pipefail
          VER=0.2.126
          curl -fsSL "https://github.com/rustwasm/wasm-bindgen/releases/download/${VER}/wasm-bindgen-${VER}-x86_64-unknown-linux-musl.tar.gz" -o wb.tar.gz
          tar -xzf wb.tar.gz
          sudo mv "wasm-bindgen-${VER}-x86_64-unknown-linux-musl"/wasm-bindgen* /usr/local/bin/
          wasm-bindgen --version
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zip

      - name: Download console assets
        uses: actions/download-artifact@v8
        with:
          name: console-embed
          path: assets/console

      - name: Build edge wasm
        run: cargo rustc --lib --crate-type cdylib --target wasm32-unknown-unknown --release --no-default-features --features edge

      # Each script regenerates that platform's wasm-bindgen glue in-place (the
      # _lib / generated dirs are gitignored build output). All build-only — no
      # platform credentials are used here.
      - name: Generate platform bundles
        run: |
          bash deploy/cloudflare/build.sh
          bash deploy/netlify/build.sh
          # deno: deploy/deno/build.sh also *deploys* (needs a token), so generate
          # the deno-target glue inline here for a build-only bundle.
          bash deploy/stage-edge-runtime.sh deno
          wasm-bindgen --target deno --out-dir deploy/deno/pkg target/wasm32-unknown-unknown/release/gproxy.wasm
          grep -q "export function gproxyFetch" deploy/deno/pkg/gproxy.js

      - name: Package edge bundles
        run: |
          mkdir -p edge-dist
          cp target/wasm32-unknown-unknown/release/gproxy.wasm edge-dist/gproxy.wasm
          (cd deploy && zip -9 -r ../edge-dist/gproxy-edge-cloudflare.zip cloudflare -x 'cloudflare/build.sh')
          (cd deploy && zip -9 -r ../edge-dist/gproxy-edge-netlify.zip netlify -x 'netlify/build.sh')
          # deno: compact upload root (main.ts path-fixed to ./pkg + the glue)
          rm -rf deploy/deno/bundle && mkdir -p deploy/deno/bundle/pkg deploy/deno/bundle/console
          cp -R deploy/deno/pkg/. deploy/deno/bundle/pkg/
          cp deploy/deno/_shared.js deploy/deno/bundle/_shared.js
          sed 's#../../pkg/gproxy.js#./pkg/gproxy.js#' deploy/deno/main.ts > deploy/deno/bundle/main.ts
          cp -R assets/console/. deploy/deno/bundle/console/
          (cd deploy/deno/bundle && zip -9 -r ../../../edge-dist/gproxy-edge-deno.zip .)
          for bundle in edge-dist/*.zip; do
            zip -j "$bundle" LICENSE
          done
          (cd edge-dist && for f in *.zip gproxy.wasm; do shasum -a 256 "$f" > "$f.sha256"; done)
          ls -la edge-dist

      - name: Upload edge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-edge
          path: edge-dist/*
          retention-days: 1

      # Refresh the orphan `deploy` branch with the freshly-built, ready-to-deploy
      # bundles (artifacts only — no source). The README one-click buttons point
      # at this branch. Force-pushed as a single fresh snapshot each workflow run.
      - name: Refresh deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          for p in cloudflare netlify; do
            cp -r "deploy/$p" "$stage/$p"
            rm -f "$stage/$p/build.sh" "$stage/$p/NOTES.md"
          done
          cp -r deploy/deno/bundle "$stage/deno"
          cp target/wasm32-unknown-unknown/release/gproxy.wasm "$stage/gproxy.wasm"
          rm -rf "$stage"/*/.temp "$stage"/*/.netlify "$stage"/*/.wrangler 2>/dev/null || true
          {
            echo "# GPROXY — deploy artifacts (auto-generated, do not edit)"
            echo
            echo "Prebuilt, ready-to-deploy edge bundles. **No source** — wasm + glue +"
            echo "each platform's entry + config. The main README's one-click buttons point"
            echo "here. Regenerated from \`${GITHUB_SHA}\` on every release workflow run."
            echo "See the main branch \`deploy/\` and \`docs/src/content/docs/deployment/edge.md\` for build details."
          } > "$stage/README.md"
          cd "$stage"
          git init -q
          git checkout -q -b deploy
          git add -A
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -q -m "deploy: prebuilt edge bundles @ ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy

  docker-build:
    name: docker ${{ matrix.variant }}-${{ matrix.arch }}
    needs: build-native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gnu
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            runtime_base: gcr.io/distroless/cc-debian13
          - variant: gnu
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
            runtime_base: gcr.io/distroless/cc-debian13
          - variant: gnu
            arch: riscv64
            runner: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            suffix: ""
            runtime_base: gcr.io/distroless/cc-debian13
          - variant: musl
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: "-musl"
            runtime_base: gcr.io/distroless/static-debian13
          - variant: musl
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            suffix: "-musl"
            runtime_base: gcr.io/distroless/static-debian13
          - variant: musl
            arch: riscv64
            runner: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            suffix: "-musl"
            runtime_base: gcr.io/distroless/static-debian13
    steps:
      - uses: actions/checkout@v7

      - name: Download linux binary
        uses: actions/download-artifact@v8
        with:
          name: docker-bin-${{ matrix.target }}
          path: dist

      - name: Prepare runtime files
        run: |
          chmod +x dist/gproxy
          mkdir -p dist/data

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gproxy
          tags: |
            type=ref,event=tag,enable=${{ env.PUBLISH_CHANNEL == 'releases' }}
            type=raw,value=latest,enable=${{ env.PUBLISH_CHANNEL == 'releases' }}
            type=raw,value=staging,enable=${{ env.PUBLISH_CHANNEL != 'releases' }}
            type=sha,prefix=staging-,enable=${{ env.PUBLISH_CHANNEL != 'releases' }}
          flavor: |
            suffix=-${{ matrix.arch }}${{ matrix.suffix }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            RUNTIME_BASE=${{ matrix.runtime_base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Combine the per-arch images into multi-arch manifest lists. Release-only
  # and staging (needs the images actually pushed to GHCR).
  docker-manifest:
    name: Docker manifest
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/gproxy
          tags: |
            type=ref,event=tag,enable=${{ env.PUBLISH_CHANNEL == 'releases' }}
            type=raw,value=latest,enable=${{ env.PUBLISH_CHANNEL == 'releases' }}
            type=raw,value=staging,enable=${{ env.PUBLISH_CHANNEL != 'releases' }}
            type=sha,prefix=staging-,enable=${{ env.PUBLISH_CHANNEL != 'releases' }}
      - name: Create manifest lists (gnu + musl)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "${tag}-amd64" "${tag}-arm64" "${tag}-riscv64"
            docker buildx imagetools create -t "${tag}-musl" \
              "${tag}-amd64-musl" "${tag}-arm64-musl" "${tag}-riscv64-musl"
          done <<< "${{ steps.meta.outputs.tags }}"

  publish-github-release:
    name: Publish GitHub Release assets
    needs:
      - prepare-release-assets
      - build-edge
      - docker-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download native + manifest assets
        uses: actions/download-artifact@v8
        with:
          name: publish-assets
          path: publish-assets

      - name: Download edge assets
        uses: actions/download-artifact@v8
        with:
          name: release-edge
          path: edge-assets

      - name: Publish versioned GitHub Release after assets are ready
        if: ${{ env.PUBLISH_CHANNEL == 'releases' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${PUBLISH_TAG}.md"
          [ -f "$notes" ] || {
            echo "missing release notes: $notes" >&2
            exit 1
          }

          mapfile -d '' release_files < <(find publish-assets edge-assets -type f -print0 | sort -z)
          [ "${#release_files[@]}" -gt 0 ] || {
            echo "no release assets prepared" >&2
            exit 1
          }

          if ! is_draft="$(gh release view "$PUBLISH_TAG" --json isDraft --jq .isDraft)"; then
            echo "missing release draft for $PUBLISH_TAG; create it with scripts/release.sh before pushing the tag" >&2
            exit 1
          fi
          if [ "$is_draft" != "true" ]; then
            echo "release $PUBLISH_TAG already exists and is published; refusing to replace assets in place" >&2
            exit 1
          fi

          gh release upload "$PUBLISH_TAG" "${release_files[@]}" --clobber
          gh release edit "$PUBLISH_TAG" \
            --title "gproxy $PUBLISH_TAG" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" \
            --verify-tag \
            --draft=false \
            --latest

      - name: Publish staging assets after all builds are ready
        if: ${{ env.PUBLISH_CHANNEL == 'staging' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f staging "$GITHUB_SHA"
          git push -f origin "refs/tags/staging"

          notes="Rolling staging build for main @ ${GITHUB_SHA}."
          if gh release view staging >/dev/null 2>&1; then
            gh release edit staging \
              --target "$GITHUB_SHA" \
              --title "gproxy staging" \
              --prerelease \
              --notes "$notes"
          else
            gh release create staging \
              --target "$GITHUB_SHA" \
              --title "gproxy staging" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          keep="$(mktemp)"
          previous="$(mktemp -d)"
          printf '%s\n' "manifest.json" > "$keep"
          find publish-assets -maxdepth 1 -type f -printf '%f\n' >> "$keep"
          if gh release download staging --pattern manifest.json --dir "$previous" >/dev/null 2>&1; then
            jq -r '.artifacts[].url | split("/")[-1]' "$previous/manifest.json" >> "$keep"
          fi
          sort -u -o "$keep" "$keep"

          mapfile -d '' release_files < <(find publish-assets -maxdepth 1 -type f ! -name manifest.json -print0 | sort -z)
          if [ "${#release_files[@]}" -gt 0 ]; then
            gh release upload staging "${release_files[@]}" --clobber
          fi
          gh release upload staging publish-assets/manifest.json --clobber

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/staging" \
            --jq '.assets[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            if grep -Fxq "$name" "$keep"; then
              continue
            fi
            case "$name" in
              *.zip|*.zip.sha256|*.apk|*.apk.sha256|*.msi|*.msi.sha256|*.dmg|*.dmg.sha256|*.deb|*.deb.sha256|*.zip.sha256.sig)
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" >/dev/null
                ;;
            esac
          done
