name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        run: |
          scripts/release-metadata.sh verify-tag "$GITHUB_REF_NAME"
          version="$(scripts/release-metadata.sh version)"
          channel=releases
          if [[ "$version" == *-* ]]; then channel=dev; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c . scripts/release-targets.json)" >> "$GITHUB_OUTPUT"

  container:
    name: Console and container image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build console once
        run: |
          docker buildx build -f deploy/container/Dockerfile --target console-dist \
            --output type=local,dest=dist/console .
      - name: Build, archive, and push container
        env:
          GPROXY_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          test -n "$GPROXY_UPDATE_PUBKEY" || { echo "missing update signing public key" >&2; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker buildx build -f deploy/container/Dockerfile --load \
            --provenance=mode=max --sbom=true \
            --build-arg "GPROXY_UPDATE_PUBKEY=$GPROXY_UPDATE_PUBKEY" \
            --build-arg "GPROXY_VERSION=${{ needs.prepare.outputs.version }}" \
            --build-arg "GPROXY_REVISION=$GITHUB_SHA" \
            --build-arg "GPROXY_BUILD_VERSION=${{ needs.prepare.outputs.version }}" \
            --build-arg "GPROXY_BUILD_CHANNEL=${{ needs.prepare.outputs.channel }}" \
            --build-arg "GPROXY_BUILD_HASH=$GITHUB_SHA" \
            --tag "$image" .
          mkdir -p dist/container
          docker save "$image" | gzip -9 > dist/container/gproxy-container-linux-amd64.tar.gz
          (cd dist/container && sha256sum gproxy-container-linux-amd64.tar.gz \
            > gproxy-container-linux-amd64.tar.gz.sha256)
          docker push "$image"
      - name: Record build provenance
        env:
          ARTIFACT_NAME: gproxy-container-linux-amd64
          GPROXY_VERSION: ${{ needs.prepare.outputs.version }}
          BUILDER: docker
        run: |
          scripts/build-provenance.sh
          mv dist/release/*.provenance.json dist/container/
      - uses: actions/upload-artifact@v7
        with:
          name: console-embed
          path: dist/console
          include-hidden-files: true
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: dist/console
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: dist/container/*
          retention-days: 1

  native:
    name: Native ${{ matrix.target }}
    needs: [prepare, container]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate update identity
        env:
          GPROXY_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          test -n "$GPROXY_UPDATE_PUBKEY" || { echo "missing update signing public key" >&2; exit 1; }
          test "$(printf '%s' "$GPROXY_UPDATE_PUBKEY" | base64 -d | wc -c)" -eq 32 || {
            echo "update signing public key must decode to 32 bytes" >&2; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: console-embed
          path: crates/gproxy-host-axum/assets/web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - if: ${{ matrix.builder == 'cross' }}
        run: cargo install cross --locked
      - if: ${{ matrix.builder == 'cargo-ndk' }}
        uses: android-actions/setup-android@v4
      - if: ${{ matrix.builder == 'cargo-ndk' }}
        run: cargo install cargo-ndk --locked
      - if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows' && '-C target-feature=+crt-static' || '' }}
          GPROXY_UPDATE_PUBKEY: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
          GPROXY_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          GPROXY_BUILD_CHANNEL: ${{ needs.prepare.outputs.channel }}
          GPROXY_BUILD_HASH: ${{ github.sha }}
          GPROXY_INSTALLATION_KIND: ${{ matrix.os == 'android' && 'android-apk' || 'standalone' }}
        run: |
          case "${{ matrix.builder }}" in
            cargo) cargo build --locked --release --bin gproxy --target "${{ matrix.target }}" ;;
            cross) cross build --locked --release --bin gproxy --target "${{ matrix.target }}" ;;
            cargo-ndk)
              target="${{ matrix.target }}"
              bindgen="BINDGEN_EXTRA_CLANG_ARGS_${target//-/_}"
              export "$bindgen=--target=${target}28"
              cargo ndk -p 28 -t "${{ matrix.ndk_target }}" \
                build --locked --release --bin gproxy
              ;;
          esac
      - name: Codesign binary
        if: ${{ matrix.os == 'macos' }}
        run: codesign --force --sign - "target/${{ matrix.target }}/release/gproxy"
      - name: Package Unix archive
        if: ${{ matrix.os != 'windows' }}
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TARGET_OS: ${{ matrix.os }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: scripts/package-native-release.sh
      - name: Package Windows archive
        if: ${{ matrix.os == 'windows' }}
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: scripts/package-native-release.ps1
      - name: Record build provenance
        env:
          ARTIFACT_NAME: ${{ matrix.artifact }}
          GPROXY_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_TRIPLE: ${{ matrix.target }}
          BUILDER: ${{ matrix.builder }}
        run: scripts/build-provenance.sh
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: |
            dist/release/${{ matrix.artifact }}.provenance.json
            dist/release/${{ matrix.artifact }}.zip
            dist/release/${{ matrix.artifact }}.zip.sha256
            dist/release/${{ matrix.artifact }}.deb
            dist/release/${{ matrix.artifact }}.deb.sha256
            dist/release/${{ matrix.artifact }}.dmg
            dist/release/${{ matrix.artifact }}.dmg.sha256
            dist/release/${{ matrix.artifact }}.msi
            dist/release/${{ matrix.artifact }}.msi.sha256
            dist/release/${{ matrix.artifact }}.apk
            dist/release/${{ matrix.artifact }}.apk.sha256
          retention-days: 1

  manifest:
    name: Signed update manifest
    needs: [prepare, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/native
          merge-multiple: true
      - name: Build and sign manifest
        env:
          UPDATE_SIGNING_PRIVATE_KEY_B64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
          UPDATE_SIGNING_PUBLIC_KEY_B64: ${{ secrets.UPDATE_SIGNING_PUBLIC_KEY_B64 }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          REPO: ${{ github.repository }}
          NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: scripts/build-update-manifest.sh
      - uses: actions/upload-artifact@v7
        with:
          name: signed-update-manifest
          path: dist/release/manifest.json
          retention-days: 1

  edge:
    name: Edge bundles
    needs: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: console/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-edge
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install matching wasm-bindgen CLI
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/, "", $3); print $3; exit}' Cargo.lock)"
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: scripts/package-edge-release.sh
      - name: Record build provenance
        env:
          ARTIFACT_NAME: gproxy-edge
          GPROXY_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_TRIPLE: wasm32-unknown-unknown
          BUILDER: wasm-bindgen
        run: scripts/build-provenance.sh
      - name: Check platform entries
        run: |
          pnpm --dir deploy/cloudflare install --no-frozen-lockfile
          pnpm --dir deploy/cloudflare check
          pnpm --dir deploy/netlify install --no-frozen-lockfile
          pnpm --dir deploy/netlify check
          deno check deploy/deno/main.ts
      - uses: actions/upload-artifact@v7
        with:
          name: edge-bundles
          path: |
            dist/release/gproxy-edge.provenance.json
            dist/release/gproxy-edge.wasm
            dist/release/gproxy-edge.wasm.sha256
            dist/release/gproxy-edge-cloudflare.zip
            dist/release/gproxy-edge-cloudflare.zip.sha256
            dist/release/gproxy-edge-deno.zip
            dist/release/gproxy-edge-deno.zip.sha256
            dist/release/gproxy-edge-netlify.zip
            dist/release/gproxy-edge-netlify.zip.sha256
          retention-days: 1

  publish:
    name: Publish release
    needs: [prepare, manifest, edge, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: dist/publish
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: signed-update-manifest
          path: dist/publish
      - uses: actions/download-artifact@v8
        with:
          name: edge-bundles
          path: dist/publish
      - uses: actions/download-artifact@v8
        with:
          name: container-image
          path: dist/publish
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mapfile -d '' files < <(find dist/publish -maxdepth 1 -type f -print0 | sort -z)
          test "${#files[@]}" -gt 0
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then release_flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            if [[ "$VERSION" == *-* ]]; then gh release edit "$GITHUB_REF_NAME" --prerelease; fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag --title "gproxy $GITHUB_REF_NAME" --generate-notes "${release_flags[@]}"
          fi
          if [ "$PUBLISH_CHANNEL" = dev ]; then
            latest_dev_version="$(gh release list --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isPrerelease and (.isDraft | not)) | .tagName' \
              | sed -n 's/^v\(3\..*\)$/\1/p' | sort -V | tail -1)"
            if [ -n "$latest_dev_version" ] && [ "$latest_dev_version" != "$VERSION" ]; then
              echo "Skipping stale dev pointer update for $VERSION; latest prerelease is $latest_dev_version."
              exit 0
            fi
            git tag -f dev "$GITHUB_SHA"
            git push -f origin refs/tags/dev
            notes="Latest signed manifest for the GPROXY v3 alpha channel ($GITHUB_REF_NAME)."
            if gh release view dev >/dev/null 2>&1; then
              gh release edit dev --target "$GITHUB_SHA" --title "gproxy v3 dev" \
                --notes "$notes" --prerelease
            else
              gh release create dev --verify-tag --title "gproxy v3 dev" \
                --notes "$notes" --prerelease
            fi
            gh release upload dev dist/publish/manifest.json --clobber
          fi
