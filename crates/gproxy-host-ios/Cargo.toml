[package]
name = "gproxy-host-ios"
description = "Native iOS session host for the existing gproxy HTTP gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
axum = { workspace = true, features = ["http1", "http2", "tokio"] }
gproxy = { workspace = true, features = ["channels", "memory", "fs", "bundled-vocabulary", "embedded-console"] }
gproxy-app = { workspace = true }
gproxy-host-axum = { workspace = true, features = ["embedded-console"] }
hyper-util = { workspace = true, features = ["server-auto", "service", "tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
