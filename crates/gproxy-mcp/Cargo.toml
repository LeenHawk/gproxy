[package]
name = "gproxy-mcp"
description = "MCP servers behind GPROXY: the upstream kind, a client towards servers, the endpoint towards callers, scopes and the audit record"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gproxy-client.workspace = true
gproxy-protocol.workspace = true
gproxy-upstream.workspace = true
http.workspace = true
# The protocol's types only; the transport here is gproxy's own outbound client.
rmcp = { version = "3.11", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
