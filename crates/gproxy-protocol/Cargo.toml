[package]
name = "gproxy-protocol"
description = "GPROXY v4 connection modelling, operation declarations, vendor wire types and pairwise conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Turns off `non_exhaustive` on the public enums. Enabled inside the workspace
# so that adding a variant produces an exhaustive-match checklist; left off for
# external consumers so that adding one is not a breaking change.
exhaustive = []

[dependencies]
blake3 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
futures-sink = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
gproxy-protocol-macros = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
time = { workspace = true, features = ["formatting"] }
multer = { workspace = true }
