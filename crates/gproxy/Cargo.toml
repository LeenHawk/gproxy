[package]
name = "gproxy"
description = "The GPROXY v4 command line: configuration, schema, bootstrap, transfer and the native server"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "gproxy"

# Two targets over one source tree. The library exists so `tests/` can drive
# the config layering, the bootstrap and the rotation directly: an integration
# test cannot reach inside a bare `[[bin]]`, and the alternative — asserting
# on a subprocess's stdout — would test the formatting rather than the rules.
[lib]
name = "gproxy"
path = "src/lib.rs"

[[bin]]
name = "gproxy"
path = "src/main.rs"

[features]
# A single-node SQLite instance with every channel this repository implements.
default = ["channels", "memory", "fs", "bundled-vocabulary"]

# Channels, forwarded to the sdk. The sdk registers each one it was compiled
# with; a build with none serves only providers whose channel a host supplies.
# `channels` is every channel this repository implements — name them one by one
# instead for a binary that carries only the upstreams a deployment uses.
channels = ["gproxy-sdk/channels"]
aistudio = ["gproxy-sdk/aistudio"]
antigravity = ["gproxy-sdk/antigravity"]
aws_bedrock = ["gproxy-sdk/aws_bedrock"]
azure = ["gproxy-sdk/azure"]
claudeapi = ["gproxy-sdk/claudeapi"]
claudecode = ["gproxy-sdk/claudecode"]
claudeweb = ["gproxy-sdk/claudeweb"]
cline = ["gproxy-sdk/cline"]
codex = ["gproxy-sdk/codex"]
copilotcli = ["gproxy-sdk/copilotcli"]
custom = ["gproxy-sdk/custom"]
dashscope = ["gproxy-sdk/dashscope"]
deepseek = ["gproxy-sdk/deepseek"]
devin = ["gproxy-sdk/devin"]
geminicli = ["gproxy-sdk/geminicli"]
grokbuild = ["gproxy-sdk/grokbuild"]
kimi = ["gproxy-sdk/kimi"]
kiro = ["gproxy-sdk/kiro"]
openai = ["gproxy-sdk/openai"]
opencode = ["gproxy-sdk/opencode"]
openrouter = ["gproxy-sdk/openrouter"]
vercel = ["gproxy-sdk/vercel"]
vertex = ["gproxy-sdk/vertex"]
vertexexpress = ["gproxy-sdk/vertexexpress"]
workbuddy = ["gproxy-sdk/workbuddy"]
xai = ["gproxy-sdk/xai"]

# Database drivers. SQLite is always compiled in; these add the others, and
# `GPROXY_PERSISTENCE`/`GPROXY_DSN` are refused at startup without them.
postgres = ["gproxy-sdk/postgres", "sea-orm/sqlx-postgres"]
mysql = ["gproxy-sdk/mysql", "sea-orm/sqlx-mysql"]

# Shared transient state. `memory` is one process; `redis` is what several
# instances of one deployment must use.
memory = ["gproxy-sdk/memory", "gproxy-cache/memory"]
redis = ["gproxy-sdk/redis", "gproxy-cache/redis"]

# Object storage for published bodies and downloaded vocabularies.
fs = ["gproxy-sdk/fs", "gproxy-file/fs"]
s3 = ["gproxy-sdk/s3", "gproxy-file/s3"]

bundled-vocabulary = ["gproxy-sdk/bundled-vocabulary"]

[dependencies]
# v3's envelope encryption, which is not v4's codec: four columns, a fixed
# authenticated-data domain and no row id bound in. `import --from-v3` has to
# open those blobs by v3's rules before the sdk can re-seal them by v4's.
aes-gcm = { workspace = true }
axum = { workspace = true, features = ["form", "http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
# Standard base64 is what the sdk's import reads a source master key in, so a
# key given here in hex is re-encoded rather than handed over as typed.
base64 = { workspace = true }
clap = { workspace = true }
# `.env`, loaded without overriding anything the real environment already set.
dotenvy = { workspace = true }
# Detached ed25519 verification of the signed update manifest. Verification
# only: nothing in this crate signs anything.
ed25519-dalek = { workspace = true }
gproxy-app = { workspace = true }
gproxy-cache = { workspace = true }
gproxy-core = { workspace = true }
gproxy-file = { workspace = true }
gproxy-host-axum = { workspace = true }
gproxy-sdk = { workspace = true }
gproxy-seaorm = { workspace = true }
gproxy-store = { workspace = true }
# The generated first-run password, and nothing else.
getrandom = { workspace = true }
# `regex::escape`, for the one v3 rewrite action that names literal text where
# v4 wants a pattern. Compiling the result is core's job, not this crate's.
regex = { workspace = true }
rust_decimal = { workspace = true }
# The two update downloads: a signed manifest and one release archive. It
# follows redirects, which a GitHub release asset URL is; that is safe here
# because the signature and the sha256 are checked after the bytes arrive.
reqwest = { workspace = true, features = ["rustls", "http2", "socks", "system-proxy"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
# Ordering a release against the running build, on every channel but `staging`.
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The source marker: SHA-256 of the v3 file's path, which is v3's own scheme
# for recording an import it has already performed.
# The artifact's integrity check, before the archive is parsed.
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The v3 master key and the opened secrets are wiped rather than left in a
# freed allocation for the rest of the process.
zeroize = { workspace = true }

# The release archive. `deflate` and nothing else: that is what
# `scripts/package-native-release.sh` writes.
zip = { workspace = true }

# Windows will not rename over a running executable and has no equivalent
# trick, so the platform dance is a crate there. On Unix the swap is a plain
# `rename(2)` and this is not compiled at all.
[target.'cfg(not(unix))'.dependencies]
self-replace = { workspace = true }

[dev-dependencies]
aes-gcm = { workspace = true }
# Signing a manifest in the tests. The release pipeline signs with `openssl`;
# this is the same detached ed25519 signature over the same payload, so a test
# that passes is a test against the wire format the pipeline writes.
ed25519-dalek = { workspace = true, features = ["rand_core"] }
http = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# The end-to-end update test serves a manifest and a fake artifact over
# loopback, because the only honest way to prove the download path is to make
# it download something.
axum = { workspace = true, features = ["form", "http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
