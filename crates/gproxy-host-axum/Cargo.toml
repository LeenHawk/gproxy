[package]
name = "gproxy-host-axum"
description = "The native HTTP host for GPROXY v4: an axum router over gproxy-app"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["embedded-console"]
embedded-console = ["dep:rust-embed"]
# Build-time documentation export; absent from normal host builds.
documentation = ["dep:utoipa", "dep:schemars", "dep:syn", "gproxy-app/schema"]

[[example]]
name = "export-docs"
required-features = ["documentation"]

[build-dependencies]
syn = { workspace = true, optional = true, features = ["visit"] }

[dependencies]
axum = { workspace = true, features = ["form", "http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
bytes = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
gproxy-app = { workspace = true }
gproxy-channel = { workspace = true }
gproxy-convert = { workspace = true }
gproxy-upstream = { workspace = true }
gproxy-core = { workspace = true }
gproxy-protocol = { workspace = true }
gproxy-sdk = { workspace = true }
gproxy-seaorm = { workspace = true }
gproxy-store = { workspace = true }
http = { workspace = true }
# The one request content-encoding this gateway decodes itself: the Codex CLI
# sends zstd, and a channel forwards bytes rather than framing.
ruzstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
serde_urlencoded = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
web-time = { workspace = true }
# `serve`: axum's own `serve` sets no timer, so hyper's header read timeout
# never takes effect under it.
hyper-util = { workspace = true, features = ["server-auto", "server-graceful", "service", "tokio"] }
mime_guess = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "system-proxy"] }
sha2 = { workspace = true }
# The console bundle, when one was built into the binary. The folder is empty
# in a source checkout, which is what makes `/console` answer 404 rather than
# pretend to serve an application that is not there.
rust-embed = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# An administrator's own console bundle arrives as a zip.
zip = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
gproxy-cache = { workspace = true, features = ["memory"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# A websocket round trip needs a real connection: `oneshot` never produces the
# `OnUpgrade` extension an upgrade is made of, so the socket tests bind a port
# and speak the protocol for real. `connect` is the client half.
tokio-tungstenite = { workspace = true, features = ["connect"] }
# `ServiceExt::oneshot`: everything that is answered over HTTP — which is every
# refusal — is driven through the router directly rather than over a socket.
tower = { workspace = true, features = ["util"] }
