[package]
name = "gproxy-host-axum"
description = "The native HTTP host for GPROXY v4: an axum router over gproxy-app"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Two targets, one router. Natively this binds axum over hyper and tokio; on
# `wasm32-unknown-unknown` it binds the same `Router` with axum's server halves
# switched off, so `gproxy-host-edge` can drive it from a Workers fetch handler
# instead of writing the route table a second time. What the wasm build leaves
# out is listed in that crate's README — the socket-shaped pieces (hyper
# upgrades, `ConnectInfo`, the embedded console), never a route.
[dependencies]
bytes = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
gproxy-app = { workspace = true }
gproxy-channel = { workspace = true }
gproxy-core = { workspace = true }
gproxy-protocol = { workspace = true }
gproxy-sdk = { workspace = true }
gproxy-seaorm = { workspace = true }
gproxy-store = { workspace = true }
http = { workspace = true }
# The one request content-encoding this gateway decodes itself: the Codex CLI
# sends zstd, and a channel forwards bytes rather than framing.
ruzstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `SystemTime::now()` inside a Worker isolate, where `std::time` has no clock.
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { workspace = true }
mime_guess = { workspace = true }
# The console bundle, when one was built into the binary. The folder is empty
# in a source checkout, which is what makes `/console` answer 404 rather than
# pretend to serve an application that is not there.
rust-embed = { workspace = true }
tokio = { workspace = true }

# The extractors the routers use and nothing else: no `http1`/`http2` (hyper is
# a server), no `tokio` (which is what `ConnectInfo` and `axum::serve` hang
# off), no `ws` (a Workers upgrade is a `WebSocketPair`, not a hyper upgrade).
# `Router` itself is target-independent, which is the whole point.
[target.'cfg(target_arch = "wasm32")'.dependencies]
axum = { version = "0.8", default-features = false, features = [
    "json",
    "matched-path",
    "query",
] }
# A JS handle is thread-bound, so on wasm the engine below this crate is `!Send`
# by design and axum's handler bound is not. `send_wrapper` is the bridge, and
# `crate::send` is the only place that names it.
send_wrapper = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
gproxy-cache = { workspace = true, features = ["memory"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# A websocket round trip needs a real connection: `oneshot` never produces the
# `OnUpgrade` extension an upgrade is made of, so the socket tests bind a port
# and speak the protocol for real. `connect` is the client half.
tokio-tungstenite = { workspace = true, features = ["connect"] }
# `ServiceExt::oneshot`: everything that is answered over HTTP — which is every
# refusal — is driven through the router directly rather than over a socket.
tower = { workspace = true, features = ["util"] }
