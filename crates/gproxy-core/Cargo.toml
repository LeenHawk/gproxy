[package]
name = "gproxy-core"
description = "Runtime data and request context contracts for the GPROXY engine"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = { workspace = true }
arc-swap = { workspace = true }
form_urlencoded = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
gproxy-cache = { workspace = true }
gproxy-channel = { workspace = true }
gproxy-client = { workspace = true }
gproxy-protocol = { workspace = true }
gproxy-seaorm = { workspace = true }
gproxy-store = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
regex = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio-util = { workspace = true }
web-time = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gproxy-cache = { workspace = true, features = ["memory"] }
gproxy-client = { workspace = true, features = ["reqwest"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
