[package]
name = "gproxy-channel"
description = "Standalone GPROXY channel contracts, optional capabilities and explicit invocation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Google AI Studio (Gemini API key) upstream: the native Gemini methods and
# the /v1beta/openai compatibility layer off one origin, SSE and JSON-array
# streams, usageMetadata metering.
aistudio = []
# Antigravity (Google account through the Antigravity editor's Code Assist
# host): PKCE login that discovers the Cloud project and tier, refresh, the
# Code Assist request envelope, the fetchAvailableModels catalogue and its
# per-model quota.
antigravity = [
    "dep:futures-util",
    "dep:getrandom",
    "dep:time",
    "dep:web-time",
]
# AWS Bedrock: every request is SigV4-signed. Anthropic models are invoked
# through bedrock-runtime InvokeModel with the Bedrock Claude Messages
# envelope, the streaming reply arrives as AWS event-stream frames that the
# channel translates into Claude Messages SSE, and the control plane's
# foundation-model directory answers ListModels/GetModel.
aws_bedrock = [
    "dep:base64",
    "dep:crc32fast",
    "dep:futures-util",
    "dep:hmac",
    "dep:sha2",
    "dep:web-time",
]
# Azure OpenAI and the Anthropic models Azure AI Foundry hosts beside them:
# an API key on the v1 or the deployment-scoped surface, no login, no refresh.
azure = []
# API-key upstreams speaking one or more native dialects verbatim.
custom = []
# OpenAI Codex (ChatGPT account) upstream: OAuth login/refresh, Responses over
# HTTP and WebSocket, x-codex rate-limit headers and /wham/usage.
codex = ["dep:url", "dep:base64", "dep:futures-util", "dep:sha2", "dep:web-time"]
# Anthropic's first-party API (api.anthropic.com) upstream: x-api-key
# Messages with the API's request hygiene and server-side fallback, the
# OpenAI SDK compatibility layer, anthropic-ratelimit-* headers and the
# organization cost report.
claudeapi = ["dep:futures-util", "dep:time", "dep:web-time"]
# Claude Code (Claude.ai subscription) upstream: PKCE and cookie login,
# refresh, Messages over HTTP with the CLI's request hygiene, unified
# rate-limit headers and /api/oauth/usage.
claudecode = [
    "dep:base64",
    "dep:futures-util",
    "dep:getrandom",
    "dep:sha2",
    "dep:time",
    "dep:web-time",
]
# Claude Web (claude.ai browser session) upstream: cookie login against
# /api/bootstrap, multi-call conversation turns translated into Claude
# Messages SSE, /api/organizations/{org}/usage quota windows.
claudeweb = [
    "dep:send_wrapper",
    "dep:base64",
    "dep:futures-util",
    "dep:getrandom",
    "dep:time",
    "dep:web-time",
]
# Devin (Windsurf) cloud upstream at server.codeium.com: Connect-RPC over
# protobuf rather than HTTP+JSON, so the channel hand-writes the envelope and
# the few messages it needs; GetChatMessage frames become OpenAI Chat
# Completions SSE, and GetUserStatus reports the daily and weekly quota
# windows over Connect's JSON codec.
devin = [
    "dep:base64",
    "dep:futures-util",
    "dep:getrandom",
    "dep:miniz_oxide",
    "dep:sha2",
    "dep:web-time",
]
# Gemini CLI (Google account through Code Assist): PKCE login that discovers
# the Cloud project and tier, refresh, the Code Assist request envelope, and
# the retrieveUserQuota catalogue and per-model quota.
geminicli = [
    "dep:futures-util",
    "dep:getrandom",
    "dep:time",
    "dep:web-time",
]
# OpenAI's own platform (api.openai.com) upstream: the full OpenAI surface,
# Responses and Realtime over a WebSocket, x-ratelimit-* headers and the
# organization cost report.
openai = ["dep:futures-util", "dep:web-time"]
# Google Vertex AI: regional project-scoped methods for the Google, Anthropic
# and OpenAI-compatible surfaces, with a service-account key exchanged for a
# short-lived access token through CredentialRefresh (RS256, hence `rsa`).
vertex = [
    "dep:base64",
    "dep:futures-util",
    "dep:getrandom_v02",
    "dep:rsa",
    "dep:web-time",
]
# Google Vertex AI Express mode: the Gemini surface with an API key in the
# query, no project and no region.
vertexexpress = []

[dependencies]
url = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
gproxy-client.workspace = true
gproxy-protocol.workspace = true
http.workspace = true
hmac = { workspace = true, optional = true }
miniz_oxide = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
send_wrapper = { workspace = true, optional = true }
# Never imported. `rsa` reaches getrandom 0.2 through rand_core 0.6, and that
# version refuses to build for wasm32-unknown-unknown unless its `js` backend
# is selected; naming it here is how a dependent selects it.
getrandom_v02 = { workspace = true, optional = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
tokio = { workspace = true, features = ["macros", "rt"] }
