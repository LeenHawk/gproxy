version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# API-key upstreams speaking one or more native dialects verbatim.
custom = []

[dependencies]
gproxy-client.workspace = true
gproxy-protocol.workspace = true
