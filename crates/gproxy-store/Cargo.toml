[package]
name = "gproxy-store"
description = "SeaORM entities and batch persistence for GPROXY v4"
readme = "README.md"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true

[features]
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
async-trait = { workspace = true }
sea-orm = { workspace = true, features = ["with-rust_decimal"] }
web-time = { workspace = true }
serde = { workspace = true }
gproxy-seaorm = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
blake3 = { workspace = true }
fastcdc = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
