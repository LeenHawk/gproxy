[package]
name = "gproxy-store"
description = "SeaORM entities and batch persistence for GPROXY v4"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
gproxy-cache = { workspace = true, default-features = false }
sea-orm = { workspace = true, features = ["with-rust_decimal"] }
web-time = { workspace = true }
serde = { workspace = true }
gproxy-seaorm = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
blake3 = { workspace = true }
fastcdc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ruzstd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
