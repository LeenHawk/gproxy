[package]
name = "gproxy-host-tauri"
description = "The GPROXY v4 application host: Tauri IPC for the management surfaces, an in-process axum data plane for the CLIs, on desktop and on Android"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "gproxy-desktop"

# Two targets over one source tree, for the same reason `gproxy` has them: the
# library is where every decision lives, and `tests/` drives it directly. The
# binary is the window — it parses nothing, decides nothing, and exists so that
# `cargo run` opens the shell.
#
# `cdylib` is the Android target's whole entry point. There is no binary on a
# phone: the activity loads `libgproxy_host_tauri.so` and calls into it, so the
# library has to be linkable as a shared object as well as an `rlib`. The
# `staticlib` that Tauri's own mobile template also lists is iOS's, and this
# crate has no iOS target — carrying it would make every desktop build produce
# a third artefact nothing links.
[lib]
name = "gproxy_host_tauri"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "gproxy-desktop"
path = "src/main.rs"

[features]
# Installer builds include all channels, local storage, and the SQL backends
# offered by first-run setup. SQLite remains the default.
default = ["channels", "memory", "fs", "bundled-vocabulary", "postgres", "mysql"]
channels = ["gproxy/channels"]
memory = ["gproxy/memory"]
fs = ["gproxy/fs"]
bundled-vocabulary = ["gproxy/bundled-vocabulary"]
postgres = ["gproxy/postgres"]
mysql = ["gproxy/mysql"]

[dependencies]
# The reduction layer in front of the host's router, and nothing else.
axum = { workspace = true, features = ["form", "http1", "http2", "json", "matched-path", "original-uri", "query", "tokio", "tower-log", "tracing", "ws"] }
gproxy = { workspace = true }
gproxy-app = { workspace = true }
gproxy-core = { workspace = true }
gproxy-host-axum = { workspace = true }
gproxy-sdk = { workspace = true }
gproxy-seaorm = { workspace = true }
# One argument type the command table names: a credential's lifecycle status.
gproxy-store = { workspace = true }
# The master key this shell mints on first run, and nothing else.
getrandom = { workspace = true }
http = { workspace = true }
# The system credential store. `v1` is the platform-native store per OS —
# Secret Service on Linux, the Keychain on macOS, the Credential Manager on
# Windows — which is exactly the set this shell wants and nothing more.
keyring = { workspace = true }
# Builds a command's name out of its surface, family and method. A table of
# two hundred entries has to derive its identifiers from the declaration, or
# the declaration stops being the single place they are written down.
paste = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# `oneshot`, which is how the console's request is handed to the router.
tower = { workspace = true, features = ["util"] }
# The one configuration file a desktop instance reads, in the schema the server
# already has. Nothing here defines a second one.
toml = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tauri-build = { workspace = true }

# Android's whole extra surface, and it is two crates.
#
# `jni` is how the foreground service reaches the engine: the activity is not
# the only entry point on a phone — the boot receiver has no activity — so
# there has to be a way in that is not Tauri's IPC bridge. The version matches
# the one `wry` already resolves for Tauri's own Android binding, so the
# application links one JNI crate rather than two.
#
# `libc` is for `pipe` and `dup2`. Android discards a process's standard
# output; splicing it into logcat is three system calls and no dependency on a
# second logging framework. See `android::install_logging`.
[target.'cfg(target_os = "android")'.dependencies]
jni = { workspace = true }
libc = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["ApplicationModel", "Win32_Storage_Packaging_Appx", "Win32_System_WinRT"] }

[dev-dependencies]
# `test` gives Tauri's `MockRuntime`, which is what lets `tests/assembly.rs`
# dispatch through the real command table on a machine with no display server.
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
# `examples/headless.rs` is the one place in this crate that installs a log
# subscriber of its own; the binary uses `gproxy::telemetry`.
tracing-subscriber = { workspace = true }
# The data-plane tests speak HTTP/1.1 over a `TcpStream` by hand rather than
# through a client crate. Two requests to loopback are four lines of bytes, and
# a real client would bring a proxy resolver that reads `HTTP_PROXY` out of the
# developer's shell and route the test somewhere else.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
