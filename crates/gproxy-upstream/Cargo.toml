[package]
name = "gproxy-upstream"
description = "Upstream accounts for GPROXY: provider and credential views, sign-in, refresh, state and caller identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
schema = ["dep:schemars"]
# `ts-rs` declarations for the types a management UI reads; see `gproxy-channel`'s `ts`.
ts = ["dep:ts-rs"]

[dependencies]
base64.workspace = true
form_urlencoded.workspace = true
getrandom.workspace = true
gproxy-client.workspace = true
gproxy-protocol.workspace = true
http.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
url.workspace = true
web-time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
