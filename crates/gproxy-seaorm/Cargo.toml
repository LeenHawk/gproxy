[package]
name = "gproxy-seaorm"
description = "SeaORM 2 batch operations and Cloudflare D1 adapter with schema sync and migrations"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
rust_decimal = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sea-orm = { workspace = true, features = ["proxy"] }
js-sys = { workspace = true }
send_wrapper = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
time = { workspace = true, features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Used only to acknowledge recorded schema-planning statements, not for data I/O.
sea-orm = { workspace = true, features = ["mock"] }

[dev-dependencies]
futures-executor = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
