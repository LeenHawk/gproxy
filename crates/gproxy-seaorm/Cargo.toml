[package]
name = "gproxy-seaorm"
description = "SeaORM 2 batch operations and libSQL adapter with schema sync and migrations"
readme = "README.md"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true

[features]
default = []
# libSQL / Turso over the Hrana HTTP pipeline (`/v2/pipeline`), through a
# caller-supplied HTTP transport. Rows come back through SeaORM's mock driver,
# because SeaORM 2.0.3's `proxy` feature does not compile next to `sqlx-sqlite`.
libsql = ["dep:base64"]
# Native SQLite: a writer task that commits queued batches together, one
# transaction per group; see `group`. Enabled by the native binary.
group-commit = ["sea-orm/sqlx-sqlite", "sea-orm/runtime-tokio", "dep:tokio", "dep:futures-util", "dep:sea-query-sqlx"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
# mock acknowledges recorded planning DDL; schema-sync uses native discovery.
sea-orm = { workspace = true, features = ["mock", "schema-sync"] }
sea-orm-migration = { workspace = true }
sea-query-sqlx = { workspace = true, optional = true, features = ["sqlx-sqlite"] }
sea-schema = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
rust_decimal = { workspace = true }
tokio = { workspace = true, optional = true, features = ["sync", "rt"] }

[dev-dependencies]
futures-executor = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
