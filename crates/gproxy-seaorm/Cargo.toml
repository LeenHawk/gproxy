[package]
name = "gproxy-seaorm"
description = "SeaORM 2 batch operations and Cloudflare D1 adapter with schema sync and migrations"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# libSQL / Turso over the Hrana HTTP pipeline (`/v2/pipeline`), through a
# caller-supplied HTTP transport; every target.
# On wasm32 rows come back through SeaORM's proxy types (already enabled);
# natively through its mock driver, because SeaORM 2.0.3's `proxy` feature does
# not compile next to `sqlx-sqlite`.
libsql = ["dep:base64"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
rust_decimal = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sea-orm = { workspace = true, features = ["proxy"] }
js-sys = { workspace = true }
send_wrapper = { workspace = true }
serde-wasm-bindgen = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
time = { workspace = true, features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# mock acknowledges recorded D1 planning DDL; schema-sync uses native discovery.
sea-orm = { workspace = true, features = ["mock", "schema-sync"] }
sea-schema = { version = "0.18.1", default-features = false }

[dev-dependencies]
futures-executor = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
