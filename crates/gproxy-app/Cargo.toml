[package]
name = "gproxy-app"
description = "GPROXY v3 bootstrap, control snapshot, and core host services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm.workspace = true
arc-swap.workspace = true
base64.workspace = true
getrandom.workspace = true
futures-util.workspace = true
gproxy-channel-api.workspace = true
gproxy-admin.workspace = true
gproxy-channels.workspace = true
gproxy-core = { workspace = true, features = ["exhaustive"] }
gproxy-protocol = { workspace = true, features = ["exhaustive"] }
gproxy-store.workspace = true
gproxy-tokenize.workspace = true
gproxy-upstream.workspace = true
bytes.workspace = true
http.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
web-time.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gproxy-tokenize = { workspace = true, features = ["count-local"] }
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers.workspace = true

[dev-dependencies]
tempfile.workspace = true
