[package]
name = "gproxy-app"
description = "Identity, admission and product operations for GPROXY v4, independent of any server"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = { workspace = true }
# Pure Rust password hashing for the console/portal login.
argon2 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# Query-parameter keys are percent-decoded before they are matched against the
# redaction list, exactly as core's observer decodes them, so the two sides of
# one request hide the same parameters.
form_urlencoded = { workspace = true }
# `wasm_js` comes from the workspace entry, which is what makes randomness
# available on wasm32-unknown-unknown without a native backend.
getrandom = { workspace = true }
gproxy-cache = { workspace = true }
gproxy-core = { workspace = true }
gproxy-protocol = { workspace = true }
# The session ladder of `design/session-identity.md` has exactly one
# implementation, and it lives in the sdk; `admission::session` wraps it rather
# than growing a second one that could drift.
gproxy-sdk = { workspace = true }
gproxy-seaorm = { workspace = true }
gproxy-store = { workspace = true }
http = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# `CancellationToken` only: a host cancels a call when its client goes away,
# and the sdk's builder takes exactly this type.
tokio-util = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

# A rate-limit charge has to be given back from a `Drop`, where nothing can be
# awaited, so the release is spawned. This is the whole of the runtime this
# crate touches: no server, no timers, no task management.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
gproxy-cache = { workspace = true, features = ["memory"] }
# The scripted channel the data-plane tests run against. Not a dependency of
# the crate itself: nothing here implements a channel.
gproxy-channel = { workspace = true }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
