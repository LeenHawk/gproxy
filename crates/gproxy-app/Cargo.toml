[package]
name = "gproxy-app"
description = "Identity, admission and product operations for GPROXY v4, independent of any server"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arc-swap = { workspace = true }
# Pure Rust password hashing for the console/portal login.
argon2 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# `wasm_js` comes from the workspace entry, which is what makes randomness
# available on wasm32-unknown-unknown without a native backend.
getrandom = { workspace = true }
gproxy-cache = { workspace = true }
gproxy-core = { workspace = true }
gproxy-protocol = { workspace = true }
gproxy-seaorm = { workspace = true }
gproxy-store = { workspace = true }
http = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
