[package]
name = "gproxy-cache"
description = "TTL state, atomic coordination and invalidation notifications for GPROXY"
readme = "README.md"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true

[features]
default = ["memory"]
memory = ["dep:tokio", "dep:web-time"]
redis = ["dep:redis", "dep:tokio", "tokio/rt", "tokio/time", "dep:futures-util"]

[dependencies]
async-trait = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
web-time = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
redis = { workspace = true, optional = true, features = ["script"] }
futures-util = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
