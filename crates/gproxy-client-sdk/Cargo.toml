[package]
name = "gproxy-client-sdk"
description = "Caller-facing, portable GPROXY client with a versioned language-model IR"
version.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true

[features]
default = ["remote", "claude", "openai", "chat", "gemini", "count-tokens", "models", "embeddings", "rerank", "audio", "images", "video"]
remote = ["dep:gproxy-client", "gproxy-client/reqwest", "gproxy-client/fetch"]
embedded = ["dep:gproxy-sdk", "dep:gproxy-seaorm", "dep:tokio-util"]
claude = []
openai = []
gemini = []
chat = []
count-tokens = []
models = []
embeddings = []
rerank = []
audio = ["dep:getrandom"]
images = []
video = ["dep:serde_urlencoded"]
ts = ["dep:ts-rs"]
s3 = ["dep:gproxy-file", "dep:sha2"]

[dependencies]
base64.workspace = true
futures-core.workspace = true
futures-util.workspace = true
gproxy-client = { workspace = true, optional = true }
gproxy-protocol.workspace = true
gproxy-file = { workspace = true, optional = true, features = ["s3"] }
getrandom = { workspace = true, optional = true }
http.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gproxy-sdk = { workspace = true, optional = true }
gproxy-seaorm = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
futures-executor.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
gproxy-sdk = { workspace = true, features = ["memory", "custom"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
