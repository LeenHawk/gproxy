workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # GitHub owns automatic builds; GitLab is an explicitly triggered backup.
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
    - if: '$GPROXY_GITLAB_CI_ENABLED == "true"'

stages: [prepare, verify, build, package, publish]

variables:
  GIT_DEPTH: "0"
  NODE_VERSION: "24.21.0"
  GO_VERSION: "1.27.1"
  RUST_VERSION: "1.98.0"
  GPROXY_BUILD_UPDATE_SOURCE: github
  GITHUB_REPOSITORY: LeenHawk/gproxy
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"

default:
  interruptible: true

console:
  stage: prepare
  image: node:24-trixie
  tags: [saas-linux-medium-amd64]
  script:
    - npm install -g pnpm@9.15.9
    - pnpm --dir console install --frozen-lockfile
    - pnpm --dir console lint
    - pnpm --dir console test
    - GPROXY_BUILD_HASH="$CI_COMMIT_SHA" pnpm --dir console build
  artifacts:
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 3 days
    paths:
      - console/dist/
      - crates/gproxy-host-axum/assets/web/
      - crates/gproxy-host-tauri/ui/

docs:
  stage: verify
  image: node:24-trixie
  tags: [saas-linux-medium-amd64]
  needs: []
  script:
    - npm install -g pnpm@9.15.9
    - pnpm --dir docs install --frozen-lockfile
    - pnpm --dir docs check
    - pnpm --dir docs build

.verify-base:
  stage: verify
  image: "$VERIFY_IMAGE"
  tags: [saas-linux-xlarge-amd64]
  timeout: 3h
  variables:
    VERIFY_IMAGE: "$CI_REGISTRY_IMAGE/build-linux:verify-$RUST_VERSION"
    CARGO_INCREMENTAL: "0"
    FF_USE_FASTZIP: "true"
    CACHE_COMPRESSION_LEVEL: fastest
  rules:
    - if: '$CI_PIPELINE_SOURCE != "external_pull_request_event" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_TAG =~ /^v4\./)'
      variables:
        VERIFY_IMAGE: "$CI_REGISTRY_IMAGE/build-linux:$CI_COMMIT_SHA"
    - when: on_success

backend:
  extends: .verify-base
  variables:
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target/verify-native"
  cache:
    key:
      prefix: "verify-native-$RUST_VERSION"
      files: [Cargo.lock]
    when: always
    paths:
      - .cargo/registry/
      - .cargo/git/
      - target/verify-native/debug/.fingerprint/
      - target/verify-native/debug/build/
      - target/verify-native/debug/deps/*.rlib
      - target/verify-native/debug/deps/*.rmeta
      - target/verify-native/debug/deps/*.so
      - target/verify-native/debug/deps/*.d
  script:
    - cargo fmt --all --check
    - cargo clippy --locked --workspace --all-targets -- -D warnings
    - cargo test --locked --workspace

wasm-verify:
  extends: .verify-base
  variables:
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target/verify-wasm"
  cache:
    key:
      prefix: "verify-wasm-$RUST_VERSION"
      files: [Cargo.lock]
    when: always
    paths: [.cargo/registry/, .cargo/git/, target/verify-wasm/]
  script:
    - cargo check --locked --target wasm32-unknown-unknown -p gproxy-protocol -p gproxy-store -p gproxy-seaorm -p gproxy-client -p gproxy-cache -p gproxy-channel -p gproxy-core -p gproxy-file -p gproxy-tokenizer -p gproxy-sdk -p gproxy-app -p gproxy-host-axum -p gproxy-host-edge
    - cargo check --locked --target wasm32-unknown-unknown -p gproxy-sdk --features libsql
    - cargo check --locked --target wasm32-unknown-unknown -p gproxy-cache --all-features
    - cargo check --locked --target wasm32-unknown-unknown -p gproxy-file --no-default-features --features s3
    - cargo check --locked --target wasm32-unknown-unknown -p gproxy-channel --all-features --lib

.release-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "external_pull_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_TAG =~ /^v4\./)'

toolchains:
  extends: .release-rules
  stage: prepare
  image: docker:28-cli
  tags: [saas-linux-xlarge-amd64]
  needs: []
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker buildx create --use
    - |
      dockerfile="$FLAVOR"
      architecture=amd64
      case "$FLAVOR" in
        linux-arm64) dockerfile=linux; architecture=arm64 ;;
        linux-riscv64) dockerfile=linux; architecture=riscv64 ;;
      esac
      docker buildx build --push --file ".gitlab/Dockerfile.$dockerfile" --build-arg "TARGET_ARCH=$architecture" --tag "$CI_REGISTRY_IMAGE/build-$FLAVOR:$CI_COMMIT_SHA" --tag "$CI_REGISTRY_IMAGE/build-$FLAVOR:verify-$RUST_VERSION" --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/build-$FLAVOR:buildcache" --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE/build-$FLAVOR:buildcache,mode=max" .
  parallel:
    matrix:
      - FLAVOR: [linux, linux-arm64, linux-riscv64, desktop, android, ohos]

.cross-package:
  extends: .release-rules
  stage: build
  image: "$CI_REGISTRY_IMAGE/build-$TOOLCHAIN:$CI_COMMIT_SHA"
  tags: [saas-linux-xlarge-amd64]
  timeout: 3h
  variables:
    CARGO_BUILD_JOBS: "12"
    CARGO_PROFILE_RELEASE_LTO: fat
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.cache"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    FF_USE_FASTZIP: "true"
    CACHE_COMPRESSION_LEVEL: fastest
  cache:
    key: "cross-$TARGET_TRIPLE-$PACKAGE_MODE"
    when: always
    paths: [.cargo/registry/, .cargo/git/, target/, .cache/, .gradle/]
  script:
    - bash scripts/gitlab/package-cross.sh "$PACKAGE_MODE"
  artifacts:
    name: "$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    expire_in: 3 days
    paths: [dist/release/, dist/container/, dist/windows/, dist/macos/]

linux:
  extends: .cross-package
  variables:
    TOOLCHAIN: linux
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [linux]
  parallel:
    matrix:
      - TARGET_TRIPLE: [x86_64-unknown-linux-gnu]
        PACKAGE_MODE: [cli, application]

linux-arm64:
  extends: linux
  variables:
    TOOLCHAIN: linux-arm64
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [linux-arm64]
  parallel:
    matrix:
      - TARGET_TRIPLE: [aarch64-unknown-linux-gnu]
        PACKAGE_MODE: [cli, application]

linux-riscv64:
  extends: linux
  variables:
    TOOLCHAIN: linux-riscv64
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [linux-riscv64]
  parallel:
    matrix:
      - TARGET_TRIPLE: [riscv64gc-unknown-linux-gnu]
        PACKAGE_MODE: [cli, application]
      - TARGET_TRIPLE: [riscv64gc-unknown-linux-musl]
        PACKAGE_MODE: [cli]

linux-musl:
  extends: linux
  variables:
    TOOLCHAIN: linux
    PACKAGE_MODE: cli
  parallel:
    matrix:
      - TARGET_TRIPLE: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]

ohos:
  extends: .cross-package
  variables:
    TOOLCHAIN: ohos
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [ohos]
  parallel:
    matrix:
      - TARGET_TRIPLE: [aarch64-unknown-linux-ohos]
        PACKAGE_MODE: [cli, application]
      - TARGET_TRIPLE: [x86_64-unknown-linux-ohos]
        PACKAGE_MODE: [cli, application]

desktop:
  extends: .cross-package
  variables:
    TOOLCHAIN: desktop
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [desktop]
  parallel:
    matrix:
      - TARGET_TRIPLE: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc, x86_64-apple-darwin, aarch64-apple-darwin]
        PACKAGE_MODE: [cli, application]

android:
  extends: .cross-package
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    TOOLCHAIN: android
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [android]
  environment:
    name: release/android
    action: prepare
  parallel:
    matrix:
      - TARGET_TRIPLE: [x86_64-linux-android, aarch64-linux-android]
        PACKAGE_MODE: [cli, application]

edge:
  extends: .release-rules
  stage: build
  image: "$CI_REGISTRY_IMAGE/build-linux:$CI_COMMIT_SHA"
  tags: [saas-linux-xlarge-amd64]
  needs:
    - console
    - job: toolchains
      artifacts: false
      parallel:
        matrix:
          - FLAVOR: [linux]
  timeout: 3h
  cache:
    key: cargo-edge
    when: always
    paths: [.cargo/registry/, .cargo/git/, target/]
  before_script:
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - bash scripts/gitlab/package-unix.sh edge
  artifacts:
    expire_in: 3 days
    paths: [dist/release/]

windows-msix:
  extends: .release-rules
  stage: package
  tags: [saas-windows-medium-amd64]
  needs:
    - job: desktop
      parallel:
        matrix:
          - TARGET_TRIPLE: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
            PACKAGE_MODE: [cli, application]
  timeout: 30m
  script:
    - '& ./scripts/gitlab/package-msix.ps1'
  artifacts:
    expire_in: 3 days
    paths: [dist/msix/]

macos-dmg:
  extends: .release-rules
  stage: package
  image: macos-26-xcode-26
  tags: [saas-macos-large-m2pro]
  needs:
    - job: desktop
      parallel:
        matrix:
          - TARGET_TRIPLE: [x86_64-apple-darwin, aarch64-apple-darwin]
            PACKAGE_MODE: [cli, application]
  timeout: 30m
  script:
    - python3 scripts/gitlab/package-dmg.py
  artifacts:
    expire_in: 3 days
    paths: [dist/dmg/]

publish:
  extends: .release-rules
  stage: publish
  image: docker:28-cli
  tags: [saas-linux-large-amd64]
  interruptible: false
  resource_group: gproxy-release
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: release/publish
  needs:
    - job: backend
      artifacts: false
    - job: wasm-verify
      artifacts: false
    - job: docs
      artifacts: false
    - linux
    - linux-arm64
    - linux-riscv64
    - ohos
    - linux-musl
    - desktop
    - android
    - edge
    - windows-msix
    - macos-dmg
  before_script:
    - apk add --no-cache bash python3 jq openssl git
  script:
    - bash scripts/gitlab/publish.sh
