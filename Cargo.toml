[workspace]
resolver = "3"
members = [
    "crates/gproxy-admin",
    "crates/gproxy-app",
    "crates/gproxy-channel-api",
    "crates/gproxy-channels",
    "crates/gproxy-core",
    "crates/gproxy-host-axum",
    "crates/gproxy-host-edge",
    "crates/gproxy-protocol",
    "crates/gproxy-protocol-macros",
    "crates/gproxy-store",
    "crates/gproxy-tokenize",
    "crates/gproxy-transform",
    "crates/gproxy-upstream",
]

[workspace.package]
version = "3.0.4"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LeenHawk/gproxy"

[workspace.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = "0.6"
arc-swap = "1"
axum = { version = "0.8", features = ["http1", "http2", "tokio", "ws"] }
base64 = "0.23"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
chacha20poly1305 = "0.11"
gproxy-app = { path = "crates/gproxy-app", version = "=3.0.4" }
gproxy-admin = { path = "crates/gproxy-admin", version = "=3.0.4" }
gproxy-channel-api = { path = "crates/gproxy-channel-api", version = "=3.0.4" }
gproxy-channels = { path = "crates/gproxy-channels", version = "=3.0.4" }
gproxy-core = { path = "crates/gproxy-core", version = "=3.0.4" }
gproxy-protocol = { path = "crates/gproxy-protocol", version = "=3.0.4" }
gproxy-protocol-macros = { path = "crates/gproxy-protocol-macros", version = "=3.0.4" }
gproxy-store = { path = "crates/gproxy-store", version = "=3.0.4" }
gproxy-tokenize = { path = "crates/gproxy-tokenize", version = "=3.0.4" }
gproxy-transform = { path = "crates/gproxy-transform", version = "=3.0.4", features = ["exhaustive"] }
gproxy-upstream = { path = "crates/gproxy-upstream", version = "=3.0.4" }
getrandom = { version = "0.4", features = ["wasm_js"] }
dashmap = { version = "6" }
getrandom_v02 = { package = "getrandom", version = "0.2", features = ["js"] }
gloo-timers = { version = "0.4", features = ["futures"] }
bytes = "1"
crc32fast = "1"
ed25519-dalek = "3"
futures-core = "0.3"
futures-util = "0.3"
form_urlencoded = "1"
http = "1"
hmac = "0.13"
js-sys = "0.3"
mime_guess = "2"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
percent-encoding = "2"
proc-macro2 = "1"
quote = "1"
redis = { version = "1.6", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
rsa = { version = "0.9", features = ["sha2"] }
regex = "1"
rust_decimal = { version = "1", features = ["serde"] }
ruzstd = "0.9"
semver = "1"
self-replace = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-mysql", "backend-postgres", "backend-sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit-mut"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = "0.7"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = "0.3"
web-time = "1"
wreq = { version = "0.16", features = ["stream", "ws", "gzip", "brotli", "zstd", "deflate", "socks"] }
wreq-util = { version = "0.2", features = ["emulation"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
zeroize = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
