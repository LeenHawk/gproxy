[workspace]
resolver = "3"
members = [
    "crates/gproxy-channel-api",
    "crates/gproxy-channels",
    "crates/gproxy-core",
    "crates/gproxy-protocol",
    "crates/gproxy-store",
    "crates/gproxy-transform",
    "crates/gproxy-upstream",
]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LeenHawk/gproxy"

[workspace.dependencies]
base64 = "0.22"
gproxy-channel-api = { path = "crates/gproxy-channel-api", version = "=3.0.0-alpha.0" }
gproxy-channels = { path = "crates/gproxy-channels", version = "=3.0.0-alpha.0" }
gproxy-core = { path = "crates/gproxy-core", version = "=3.0.0-alpha.0" }
gproxy-protocol = { path = "crates/gproxy-protocol", version = "=3.0.0-alpha.0" }
gproxy-transform = { path = "crates/gproxy-transform", version = "=3.0.0-alpha.0" }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
js-sys = "0.3"
rust_decimal = { version = "1", features = ["serde"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = "0.3"
wreq = { version = "6.0.0-rc.29", features = ["stream", "ws", "gzip", "brotli", "zstd", "deflate"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
