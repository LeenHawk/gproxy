[workspace]
resolver = "3"
members = [
    "crates/gproxy-app",
    "crates/gproxy-channel-api",
    "crates/gproxy-channels",
    "crates/gproxy-core",
    "crates/gproxy-host-axum",
    "crates/gproxy-protocol",
    "crates/gproxy-store",
    "crates/gproxy-tokenize",
    "crates/gproxy-transform",
    "crates/gproxy-upstream",
]

[workspace.package]
version = "3.0.0-alpha.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LeenHawk/gproxy"

[workspace.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
arc-swap = "1"
axum = { version = "0.8", features = ["http1", "http2", "tokio", "ws"] }
base64 = "0.22"
gproxy-app = { path = "crates/gproxy-app", version = "=3.0.0-alpha.0" }
gproxy-channel-api = { path = "crates/gproxy-channel-api", version = "=3.0.0-alpha.0" }
gproxy-channels = { path = "crates/gproxy-channels", version = "=3.0.0-alpha.0" }
gproxy-core = { path = "crates/gproxy-core", version = "=3.0.0-alpha.0" }
gproxy-protocol = { path = "crates/gproxy-protocol", version = "=3.0.0-alpha.0" }
gproxy-store = { path = "crates/gproxy-store", version = "=3.0.0-alpha.0" }
gproxy-tokenize = { path = "crates/gproxy-tokenize", version = "=3.0.0-alpha.0" }
gproxy-transform = { path = "crates/gproxy-transform", version = "=3.0.0-alpha.0" }
gproxy-upstream = { path = "crates/gproxy-upstream", version = "=3.0.0-alpha.0" }
getrandom = { version = "0.3", features = ["wasm_js"] }
bytes = "1"
crc32fast = "1"
futures-core = "0.3"
futures-util = "0.3"
http = "1"
hmac = "0.12"
js-sys = "0.3"
rsa = { version = "0.9", features = ["sha2"] }
rust_decimal = { version = "1", features = ["serde"] }
sea-query = { version = "1.0.2", default-features = false, features = ["backend-sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
toml = "0.9"
tracing = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = "0.3"
wreq = { version = "6.0.0-rc.29", features = ["stream", "ws", "gzip", "brotli", "zstd", "deflate"] }
zeroize = "1"

[profile.release]
lto = "thin"
strip = "symbols"
