[build]
# Fetches the prebuilt engine into lite/ (prepare-lite.mjs).
command = "npm run build"
publish = "public"

[functions]
directory = "functions"
# Keeps the files where they are, so the function finds the module beside it.
node_bundler = "nft"
included_files = ["lite/**"]

# Renews the sign-ins that are about to expire, so they outlive a period
# without requests. Once a day is enough for a refresh token; the times are UTC.
[functions."renew"]
schedule = "0 4 * * *"

# Asked for by the deploy button. The JSON holds secrets; mark the variable
# secret in the site settings afterwards.
[template.environment]
GPROXY_LITE_CONFIG = "Configuration JSON, e.g. {\"access_key\":\"choose-a-long-random-key\",\"providers\":[{\"name\":\"openai\",\"channel\":\"openai\",\"credential\":\"sk-...\"}]}"
