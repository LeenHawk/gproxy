services:
  - type: web
    name: gproxy
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/serverless/Dockerfile
    dockerContext: ./deploy/serverless
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8787"
      - key: GPROXY_DATABASE_URL
        sync: false
      - key: GPROXY_ADMIN_PASSWORD
        generateValue: true
      - key: GPROXY_MASTER_KEY
        generateValue: true
