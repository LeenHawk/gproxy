services:
  - type: web
    name: gproxy
    runtime: image
    image:
      url: ghcr.io/leenhawk/gproxy:latest
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8787"
      # Reads GPROXY_DATABASE_URL below as the connection string.
      - key: GPROXY_PLATFORM_ENV
        value: "1"
      - key: GPROXY_PERSISTENCE
        value: postgres
      - key: GPROXY_DATABASE_URL
        sync: false
      - key: GPROXY_ADMIN_PASSWORD
        generateValue: true
      - key: GPROXY_MASTER_KEY
        generateValue: true
